<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE7DA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sophie">
<title>Sophie Pura Vida</title>
<style>
:root {
  --sand: #EFE7DA;
  --sand-tief: #E3D8C6;
  --karte: #FFFFFF;
  --ink: #2B2723;
  --grau: #8B8175;
  --terra: #B65A3C;
  --terra-hell: #F3E2DA;
  --alarm: #A8322A;
  --alarm-hell: #F6DEDA;
  --linie: #DED2BF;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  width: 100%; max-width: 100%;
  overflow-x: clip;
}

body {
  background: var(--sand);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 20px;
}

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img { max-width: 100%; display: block; }
mark { background: #F6E7B0; color: var(--ink); padding: 0 2px; border-radius: 2px; }

/* ── Grundelemente ── */

.block { display: block; width: 100%; text-align: left; }
.zeile { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.zeile.mitte { align-items: baseline; }
.zeile.luecke { justify-content: flex-start; gap: 10px; }
.min0 { min-width: 0; }
.ikon { display: inline-flex; align-items: center; }
.verborgen { display: none; }
.verborgen.offen { display: block; margin-top: 14px; }
.abstandoben { margin-top: 30px; }
.abstandunten { margin-bottom: 12px; }
.vorzeile { white-space: pre-line; }
.brechen { word-break: break-all; }

.karte {
  background: var(--karte);
  border: 1px solid var(--linie);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
}
.karte.terra { background: var(--terra-hell); border-color: #E8CFC3; }
.karte.alarm { background: var(--alarm-hell); border-color: #EBC6C0; }
.karte.tipp { border-color: var(--terra); }
.karte.bild { padding: 0; overflow: hidden; }
.polster { padding: 10px 14px; }

.klein { font-size: 12.5px; color: var(--grau); }
.klein2 { font-size: 16px; }
.hinweis { font-size: 13px; color: var(--grau); line-height: 1.5; }
.text { font-size: 14px; line-height: 1.6; }
.notiz { font-size: 12.5px; color: var(--terra); margin-top: 5px; }
.fussnote { font-size: 11.5px; color: var(--grau); line-height: 1.5; margin-top: 18px; }

/* ── Kopfbereich ── */

.kopfzeile {
  position: sticky; top: 0; z-index: 50;
  max-width: 480px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 8px; padding-bottom: 10px;
  padding-left: max(20px, env(safe-area-inset-left));
  padding-right: max(20px, env(safe-area-inset-right));
  background: var(--sand);
  border-bottom: 1px solid rgba(43, 39, 35, .08);
}
.platzhalter { width: 40px; flex-shrink: 0; }
.notknopf {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--alarm-hell); border: 1px solid #EBC6C0;
  border-radius: 99px; padding: 7px 14px 7px 11px;
  font-size: 13px; color: var(--alarm); font-weight: 500;
}
.lupe {
  width: 40px; height: 40px; border-radius: 20px;
  background: var(--karte); border: 1px solid var(--linie);
  display: flex; align-items: center; justify-content: center;
}

.kopf { margin-bottom: 24px; margin-top: 6px; }
.kopf h1 {
  font-weight: 700; font-size: 24px; line-height: 1.1; margin: 0; color: var(--ink); }
.kopf .unter { font-size: 14px; color: var(--grau); margin: 8px 0 0; line-height: 1.55; }
.zurueck {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--terra); font-size: 14px; margin-bottom: 16px;
}

.titelblock { padding: 4px 0 14px; }
.obertitel { font-size: 12px; color: var(--grau); letter-spacing: 0.14em; text-transform: uppercase; }
.gross {
  font-weight: 700; font-size: 32px; line-height: 1.05; margin: 6px 0 0; color: var(--ink); }
.strich { width: 48px; height: 3px; background: var(--terra); border-radius: 2px; margin: 10px 0; }

/* ── Startseite ── */

.alarmkachel {
  display: block; width: 100%; text-align: left;
  background: var(--alarm-hell); border: 1px solid #EBC6C0;
  border-radius: 16px; padding: 18px; margin-bottom: 14px;
}
.alarmtitel {
  font-weight: 700; font-size: 23px; color: var(--alarm); }
.alarmtext { font-size: 13px; color: #8B5A52; margin-top: 7px; line-height: 1.45; }

.raster { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kachel {
  background: var(--karte); border: 1px solid var(--linie);
  border-radius: 16px; padding: 14px 16px; text-align: left;
}
.kacheltitel {
  font-weight: 600; font-size: 16px; line-height: 1.2; margin-bottom: 5px; }

/* ── Rundknöpfe ── */

.rundknopf {
  width: 38px; height: 38px; border-radius: 19px; background: var(--terra);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.rundknopf.klein { width: 36px; height: 36px; }
.rundknopf.gross { width: 46px; height: 46px; border-radius: 23px; }
.rundknopf.alarm { background: var(--alarm); }
.rundknopf.hell { background: var(--terra-hell); }
.knopfreihe { display: flex; gap: 8px; flex-shrink: 0; }

.nummer {
  font-weight: 600; font-size: 21px; margin-top: 2px; }
.nummer.alarm { color: var(--alarm); }
.satz { font-size: 19px; margin-top: 4px; }

/* ── Aktionsfelder in Textblöcken ── */

.aktionsfeld {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--terra-hell); border: 1px solid #E8CFC3;
  border-radius: 12px; padding: 12px 14px; margin-top: 10px;
}
.aktionswert { font-size: 18px; margin-top: 2px; line-height: 1.35; }
.leerfeld {
  background: var(--sand); border: 1px dashed var(--linie);
  border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-size: 13px;
}

/* ── Textblöcke ── */

.blocktitel {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 10px;
}
.abschnitt {
  font-weight: 600; font-size: 16px; }
.punkte li {
  position: relative; padding-left: 18px; font-size: 14px; line-height: 1.55; margin-bottom: 10px;
}
.punkte li::before {
  content: ""; position: absolute; left: 0; top: 8px;
  width: 5px; height: 5px; border-radius: 5px; background: var(--terra);
}
.punkte li.ohnepunkt { padding-left: 0; }
.punkte li.ohnepunkt::before { display: none; }
.punkte li:last-child { margin-bottom: 0; }

.schritte li { display: flex; gap: 12px; margin-bottom: 12px; }
.schritte .ziffer {
  width: 22px; height: 22px; border-radius: 11px; background: var(--terra); color: #fff;
  font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.schritte b { font-size: 14px; display: block; }
.schritte .hinweis { display: block; margin-top: 3px; }

/* ── Reiter ── */

.reiter { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.chip {
  padding: 8px 16px; border-radius: 999px; font-size: 13px;
  border: 1px solid var(--linie); color: var(--grau);
}
.chip.an { background: var(--ink); color: var(--sand); border-color: var(--ink); }
.notfallknopf {
  width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--alarm-hell); border: 1px solid #EBC6C0;
}
.notfallknopf.an { background: var(--alarm); border-color: var(--alarm); }

.landwahl { display: flex; gap: 8px; margin-bottom: 16px; }
.landknopf {
  flex: 1; padding: 10px; border-radius: 12px; font-size: 14px;
  border: 1px solid var(--linie); color: var(--grau);
}
.landknopf.an { color: #fff; }

/* ── Haken ── */

.haken { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 8px 0; text-align: left; }
.haken .box {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--linie);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
}
.haken .box.an { background: var(--terra); border-color: var(--terra); }
.hakentext { font-size: 14px; line-height: 1.45; }
.haken.ab .hakentext { color: var(--grau); text-decoration: line-through; }

/* ── Eingaben ── */

.suchzeile {
  display: flex; align-items: center; gap: 12px; background: var(--karte);
  border: 1px solid var(--linie); border-radius: 16px; padding: 12px 16px; margin-bottom: 20px;
}
.suchfeld { flex: 1; border: 0; outline: none; background: none; font-size: 16px; color: var(--ink); }
.feld { display: block; margin-bottom: 16px; }
.feld input {
  width: 100%; margin-top: 5px; padding: 10px 12px; font-size: 16px;
  border: 1px solid var(--linie); border-radius: 12px; background: var(--sand); color: var(--ink);
}
.textknopf { color: var(--terra); font-size: 13px; }

/* ── Suchtreffer ── */

.ortlabel {
  font-size: 11px; color: var(--terra); letter-spacing: 0.06em;
  text-transform: uppercase; margin-bottom: 4px;
}
.ortlabel.grau { color: var(--grau); letter-spacing: 0.1em; }
.treffertitel {
  font-weight: 600; font-size: 16px; line-height: 1.3; margin-bottom: 5px; }

/* ── Hostels ── */

.prozeile { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.5; margin-bottom: 6px; }
.prozeile .ikon { margin-top: 3px; flex-shrink: 0; }
.minus { color: var(--alarm); font-size: 15px; flex-shrink: 0; }

/* ── Route ── */

.zeitstrahl { position: relative; padding-left: 26px; }
.strang { position: relative; padding-left: 30px; }
.strang::before {
  content: ""; position: absolute; left: 9px; top: 10px; bottom: 22px;
  width: 2px; background: var(--sand-tief);
}
.etappe { position: relative; margin-bottom: 20px; }
.etappe .punkt {
  position: absolute; left: -30px; top: 3px; width: 21px; height: 21px; border-radius: 11px;
  background: var(--terra); border: 2px solid var(--terra);
  color: #fff; font-size: 11px; font-weight: 600; line-height: 17px; text-align: center;
}
.etappe .punkt.offen { background: var(--sand); border-color: var(--grau); color: var(--grau); }
.etappenort {
  font-weight: 600; font-size: 16px; margin: 3px 0 4px; }


/* ── Aufklappbare Blöcke: leichte Zeilen statt Karten ── */
.blockband {
  background: var(--karte); border: 1px solid #E6DCCB; border-radius: 12px;
  overflow: hidden; margin-bottom: 14px; padding: 6px 0;
}
.bandtitel {
  font-weight: 600;
  font-size: 17px; line-height: 1.15; color: var(--ink);
  padding: 12px 14px 7px; margin: 0 14px 5px 22px;
  border-bottom: 1px solid var(--linie); padding-left: 0; padding-right: 0;
}
.faltkarte {
  padding: 0; background: none; border: 0; border-radius: 0; margin: 0;
}
.faltkopf {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; padding: 6px 15px; text-align: left;
}
.blocktitel.ohneabstand { margin-bottom: 0; }
.faltpfeil { display: inline-flex; flex-shrink: 0; transition: transform .15s; }
.faltpfeil.auf { transform: rotate(180deg); }
.faltinhalt { display: none; padding: 0 14px 11px; }

/* Sofortmassnahme und Zusatzinformation behalten ihre Fläche */
.karte.faltkarte.dringend, .karte.faltkarte.zusatz {
  border: 1px solid; border-radius: 12px; margin: 4px 0 10px;
}
.karte.faltkarte.dringend { background: var(--alarm-hell); border-color: #EBC6C0; }
.karte.faltkarte.zusatz { background: #FBF3DC; border-color: #EBDFBC; }
.karte.faltkarte.dringend .faltkopf,
.karte.faltkarte.zusatz .faltkopf { padding: 13px 14px; }
.karte.faltkarte.dringend .faltinhalt,
.karte.faltkarte.zusatz .faltinhalt { padding: 0 14px 14px; }
.faltinhalt.offen { display: block; }

.begriff { display: block; font-size: 14px; font-weight: 600; line-height: 1.45; }
.begrifftext { display: block; font-size: 13.5px; color: var(--grau); margin-top: 2px; line-height: 1.5; }

.banner { border: 1px solid var(--linie); border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
.banner img { display: block; width: 100%; height: 92px; object-fit: cover; object-position: center 42%; }
.puravida { color: var(--terra); }

.ruecksetzen { display: none; margin-top: 12px; font-size: 12.5px; color: var(--grau); }

.gruppenzeile {
  display: flex; align-items: center; justify-content: space-between; margin: -8px 0 8px;
}
.gruppentitel {
  font-size: 11px; color: var(--grau); letter-spacing: .08em; text-transform: uppercase;
}
/* Grössenordnung der App:
   Seitentitel 30 · Bereich 19 · Block 15 · Text 14 · Hinweis 13 · Etikett 11.
   Eine Überschrift ist nie kleiner als das, was unter ihr steht. */
.gruppentitel.klein3 {
  font-weight: 600;
  font-size: 17px; letter-spacing: 0;
  text-transform: none; color: var(--ink); font-weight: 400;
  margin: 0 0 7px 3px;
}
.zuknopf { font-size: 12.5px; color: var(--terra); }
.mehrknopf { font-size: 12.5px; color: var(--grau); margin: -8px 0 20px; display: block; }

.titelzeile { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.titelzeile .lupe { margin-top: 2px; flex-shrink: 0; }

/* ── Kopfbild mit Titel darunter ── */
.held {
  background: #FFFFFF; border: 1px solid #E5E0DA; border-radius: 14px;
  overflow: hidden; contain: content; margin: 16px 0 16px;
}
.held img { display: block; width: 100%; height: auto; aspect-ratio: 21 / 9; }
.heldtext {
  padding: 18px; box-shadow: inset 0 1px 0 rgba(0,0,0,.06);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.heldtitel {
  font-weight: 700; font-size: 27px; color: #211C18; line-height: 1.15; }
.heldunter { font-size: 13.5px; line-height: 1.5; color: #5A524C; margin-top: 8px; }
.heldlupe {
  width: 40px; height: 40px; border-radius: 20px; flex-shrink: 0; margin-top: 29px;
  background: var(--sand); border: 1px solid var(--linie);
  display: flex; align-items: center; justify-content: center;
}

/* ── Leiste unten ── */
.tableiste {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; max-width: 480px; margin: 0 auto;
  background: rgba(255, 253, 250, .92);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  backdrop-filter: saturate(180%) blur(14px);
  border-top: 0.5px solid rgba(43, 39, 35, .12);
  padding: 6px 2px calc(7px + env(safe-area-inset-bottom));
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10.5px; padding: 3px 0;
}
.tab.an span { font-weight: 600; }
#app { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }

.termindatum {
  width: 62px; flex-shrink: 0; font-size: 11.5px; color: var(--terra);
  letter-spacing: .04em; text-transform: uppercase;
}

/* ── Eigene Punkte in Checklisten ── */
.hakenzeile { display: flex; align-items: flex-start; }
.hakenzeile .haken { flex: 1; }
.weg {
  width: 30px; align-self: center; font-size: 19px; line-height: 1;
  color: var(--grau); flex-shrink: 0;
}
.neuzeile {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
  padding-top: 10px; border-top: 0.5px solid var(--linie);
}
.plus { color: var(--terra); font-size: 17px; width: 20px; text-align: center; flex-shrink: 0; }
.neufeld {
  flex: 1; border: 0; outline: none; background: none;
  font-size: 14px; color: var(--ink); padding: 4px 0;
}
.neufeld::placeholder { color: var(--grau); }

/* ── Meldeformular ── */
.meldezeile { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
.meldewert { font-size: 14px; text-align: right; }
.meldeleer { font-size: 13px; color: var(--grau); font-style: italic; text-align: right; }
.meldelabel { display: block; margin-bottom: 14px; }
.meldehilfe { display: block; font-size: 11.5px; color: var(--grau); margin-top: 1px; }
.meldefeld {
  width: 100%; margin-top: 5px; padding: 9px 11px; font-size: 16px;
  border: 1px solid var(--linie); border-radius: 10px;
  background: var(--sand); color: var(--ink); font-family: inherit; resize: vertical;
}
.meldeknoepfe { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.meldeknopf {
  background: #fff; border: 1px solid #E8CFC3; border-radius: 12px;
  padding: 12px 14px; font-size: 14px; color: var(--ink); text-align: left;
}
.ruecksetzen.sichtbar { display: block; }

.version { font-size: 10.5px; color: var(--grau); opacity: .7; margin-top: 10px; }

/* Startseite: Bild und Notfall bleiben oben, nur die Termine scrollen. */
.startkopf {
  max-width: 480px; margin: 0 auto;
  padding: 0 max(20px, env(safe-area-inset-left)) 6px;
}

/* Schmale Notfallleiste auf der Startseite */
.notfallzeile { display: flex; justify-content: flex-end; margin-top: 46px; margin-bottom: 4px; }
.notfallleiste {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--alarm-hell); border: 1px solid #EBC6C0;
  border-radius: 12px; padding: 9px 9px 9px 15px;
}
.notfallwort { font-size: 17px; color: var(--alarm); }
.rundknopf.alarm.klein { width: 32px; height: 32px; border-radius: 16px; }
.notfallpfeil { display: inline-flex; transform: rotate(-90deg); opacity: .7; }

.hakentext.wichtig { font-weight: 600; }
.hakenzeile.trennlinie { border-top: 1px solid var(--linie); margin-top: 6px; padding-top: 6px; }

.mehrwoche { display: block; margin-top: -4px; }


/* ══ Breite Bildschirme: zwei Spalten statt schmaler Säule ══════════ */
@media (min-width: 900px) {
  #app {
    max-width: 1080px;
    padding: 0 40px calc(96px + env(safe-area-inset-bottom));
  }

  .kopfzeile { max-width: 1080px; padding-left: 40px; padding-right: 40px; }
  .startkopf { max-width: 1080px; padding-left: 40px; padding-right: 40px; }
  .tableiste { max-width: 1080px; }

  /* Startseite: Bild links, Notfall und Termine rechts */
  .startkopf { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; align-items: start; }
  .startkopf .held { margin: 10px 0 0; }
  .startkopf .notfallleiste { margin-top: 10px; }

  /* Inhalte zweispaltig fliessen lassen */
  .spalten {
    column-count: 2; column-gap: 28px;
  }
  .spalten > * { break-inside: avoid; }

  .held img { height: auto; }
  .heldtitel { font-size: 30px; }

  /* Leiste unten bekommt mehr Luft */
  .tab { font-size: 12px; }
  .tab svg { width: 23px; height: 23px; }

  /* Karten etwas grosszügiger */
  .karte { padding: 20px 22px; }
  .kopf h1 { font-size: 26px; }
}

/* ── Terminliste auf der Startseite ── */
.terminkarte { padding: 5px 16px; }
.terminzeile { padding: 6px 0; }
.terminzeile.mitlinie { border-top: 1px solid var(--linie); }
.terminhaken { flex-shrink: 0; margin-top: 3px; }
.terminhaken .box {
  width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--linie);
  display: inline-flex; align-items: center; justify-content: center;
}
.terminhaken .box.an { background: var(--terra); border-color: var(--terra); }
.terminknopf { flex: 1; text-align: left; }
.terminwas { display: block; font-size: 14px; line-height: 1.45; margin-top: 2px; }
.terminwann {
  display: block; font-size: 10.5px; color: var(--grau);
  letter-spacing: .05em; text-transform: uppercase;
}
.terminwann.bald { color: var(--terra); }
.terminwas.ab { color: var(--grau); text-decoration: line-through; }
.termintextblock { display: block; margin: 6px 0 2px; }
.termintext { display: block; font-size: 12.5px; color: var(--grau); line-height: 1.45; margin-bottom: 5px; }

.terminaufgaben { margin: 4px 0 0; }
.terminaufgaben .haken { align-items: flex-start; padding: 3px 0; gap: 9px; }
.terminaufgaben .termintext { margin-bottom: 0; }

.box.klein { width: 17px; height: 17px; border-radius: 5px; }

.terminstand {
  margin-left: 14px; font-size: 11.5px; font-weight: 400; color: var(--grau);
  background: var(--sand); border-radius: 99px; padding: 1px 7px;
}

.offenzeile { display: flex; gap: 16px; margin-top: 10px; padding-top: 8px;
              border-top: 1px solid var(--linie); }
.offenwann { color: var(--terra); font-size: 12px; }

/* ── Sprung zu einer anderen Stelle in der App ── */
.sprung {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: var(--sand); border: 1px solid var(--linie); border-radius: 10px;
  padding: 9px 12px; margin-top: 4px;
}
.sprungtext { flex: 1; font-size: 13.5px; color: var(--terra); }
.sprungpfeil { display: inline-flex; transform: rotate(-90deg); }

.registernr {
  font-size: 10.5px; color: var(--terra); letter-spacing: .06em;
  text-transform: uppercase; margin-bottom: 3px;
}

/* ── Notfall: Nummernknopf oben, Reiter darunter ── */
.notfallreiter { margin-bottom: 14px; }
.nummernknopf {
  display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
  background: var(--alarm-hell); border: 1px solid #EBC6C0; border-radius: 12px;
  padding: 11px; margin-bottom: 9px;
  font-size: 16px; color: var(--alarm);
}
.nummernknopf.an { background: var(--alarm); border-color: var(--alarm); color: #fff; }
.notfallreiter .reiter { margin-bottom: 0; }

.hinweiskarte { border-left: 3px solid var(--terra); }

/* ── Sofortmassnahmen: heller Alarmgrund, roter Rand ── */
.karte.dringend {
  background: var(--alarm-hell);
  border-color: #EBC6C0;
  border-left: 3px solid var(--alarm);
}
.karte.dringend .blocktitel { color: var(--alarm); }
.karte.dringend .faltpfeil svg { stroke: var(--alarm); }

/* Wochenende-Kasten auf der Startseite: enger gesetzt */
.wochenende .haken { padding: 4px 0; }
.wochenende .hakentext { line-height: 1.35; }
.wochenende .neuzeile { margin-top: 6px; padding-top: 8px; }


.faltkarte .zeile.mitte { flex: 1; }

.gesamtstand { font-size: 12.5px; color: var(--grau); }

/* ── Etappen als Knopf ── */
.etappeknopf { position: relative; width: 100%; text-align: left; background: none; border: 0; }
.etappepfeil {
  position: absolute; right: 0; top: 2px;
  display: inline-flex; transform: rotate(-90deg);
}
.zurueckzeile {
  display: flex; align-items: center; gap: 6px; background: none; border: 0;
  font-size: 13px; color: var(--terra); padding: 0 0 6px;
}
.zurueckpfeil { display: inline-flex; transform: rotate(90deg); }
.landtitel {
  font-weight: 600; font-size: 22px; color: var(--tinte); margin-bottom: 10px; }

/* Länderfarben im Zeitstrahl */
.ortlabel.gt { color: #7A6A4F; letter-spacing: 0.1em; }
.ortlabel.cr { color: #4E6B52; letter-spacing: 0.1em; }

.flagge { border-radius: 2px; vertical-align: middle; }
.ortlabel.zeile { display: flex; align-items: center; gap: 6px; }
.ortlabel.pe { color: #A33; letter-spacing: 0.1em; }

/* Ländermarke im Zeitstrahl */
.landmarke {
  display: flex; align-items: center; gap: 10px;
  font-size: 20px; letter-spacing: -0.01em;
  margin: 26px 0 10px; padding: 0;
}
.landmarke:first-child { margin-top: 2px; }
.landmarke.gt { color: #7A6A4F; }
.landmarke.cr { color: #4E6B52; }
.landmarke.pe { color: #A33; }

.landknopf { background: none; border: 0; width: 100%; text-align: left; }
.landpfeil { display: inline-flex; transform: rotate(-90deg); opacity: .55; margin-left: 2px; }

/* Notruf 911: Nummer links, Text daneben, Telefon rechts */
.notrufzeile { align-items: center; gap: 14px; }
.notrufnr {
  font-weight: 700;
  font-size: 32px; line-height: 1;
  color: var(--alarm); flex-shrink: 0;
}

.chip.chipalarm { color: var(--alarm); border-color: #EBC6C0; }
.chip.chipalarm.an { background: var(--alarm); border-color: var(--alarm); color: #fff; }

/* Zusatzinformation: leicht gelb hinterlegt */
.karte.zusatz { background: #FBF3DC; border-color: #EBDFBC; }
.karte.zusatz .blocktitel { color: #7A6320; }
.karte.zusatz .faltpfeil svg { stroke: #9A7D28; }

/* Begriff mit Zusatztext */
.mitmehr { list-style: none; }
.mehrknopfzeile { display: flex; align-items: baseline; gap: 8px; text-align: left; }
.mehrmarke {
  display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  background: #FBF3DC; border: 1px solid #E8D9AE; border-radius: 11px;
  padding: 2px 9px 2px 4px; margin-left: 8px;
}
.mehrmarke.auf { background: #F3E7C6; }
.mehrzeichen {
  width: 15px; height: 15px; border-radius: 8px; flex-shrink: 0;
  background: #E0CE96; color: #6B551A; font-size: 10.5px; line-height: 15px;
  text-align: center; font-style: italic; font-weight: 600;
}
.mehrtext { font-size: 11.5px; color: #7A6320; white-space: nowrap; }
.mehrbox {
  display: none; background: #FBF3DC; border: 1px solid #EBDFBC; border-radius: 10px;
  padding: 10px 12px; margin: 8px 0 2px;
}
.mehrbox.offen { display: block; }
.mehrbox .text { font-size: 13px; line-height: 1.5; color: #5C4C1C; }

/* Einträge in einer Gruppe: kleiner und in Navy, damit der Titel führt */
.blockband .faltkopf .blocktitel { font-weight: 400; color: #55504A; }


/* Nach dem roten Sofortblock beginnt der ruhige Teil – deutlich mehr Luft */
.karte.faltkarte.dringend + .gruppentitel.klein3 { margin-top: 44px; }

/* Übersichtskarte auf Heute – gleiche Fläche wie die Gruppen */
.blockband .zeile.mitte { padding: 2px 0; }

/* Kopfzeile einer Hakenliste in der Klappzeile: kein Abstand nach unten */
.blockband .faltkopf .zeile.mitte { padding: 0; }
.blockband .faltkopf .blocktitel { margin-bottom: 0; }
.blockband > .faltkarte > .faltkopf { padding-top: 5px; padding-bottom: 5px; }

.stationkopf { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }



/* Aufgeklappte Station in der Zeitachse */
.stationsinhalt { margin: 2px 0 22px; }
.etappeknopf.auf .etappenort { color: var(--terra); }
.etappepfeil.auf { transform: rotate(0deg); }

/* ── Ländermarke und Stationszeile: drei Ebenen ── */
.landmarke {
  display: flex; align-items: flex-start; gap: 10px;
  margin: 30px 0 12px; padding: 0; width: 100%; text-align: left;
}
.landmarke:first-child { margin-top: 4px; }
.landtext { flex: 1; }
.landzeile { display: flex; align-items: center; gap: 9px; }
.landname {
  font-weight: 600; font-size: 21px; line-height: 1.1; }
.landname.gt { color: #7A6A4F; }
.landname.cr { color: #4E6B52; }
.landname.pe { color: #A33; }
.landzeit { font-size: 12.5px; color: var(--grau); margin: 3px 0 2px; }
.landpfeil { display: inline-flex; transform: rotate(-90deg); margin-top: 6px; }

.etappenzeit { font-size: 12px; color: var(--grau); margin: 1px 0 3px; }

/* Inhalt eines Beutels – zweite Zeile in der Checkliste */
.unterzeile { display: block; font-size: 12.5px; color: var(--grau); line-height: 1.4; margin-top: 1px; }

/* Tourismusportal – schmale farbige Zeile in der Route */
.portalzeile {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: #E8EFE7; border: 1px solid #CBDAC7; border-radius: 10px;
  padding: 8px 12px; margin: 0 0 14px;
}
.portaltext { font-size: 13px; color: #3E5A42; }

/* Buchen – der einzige Weg nach aussen, deshalb kräftig */
.karte.buchenkarte {
  position: relative;
  background: var(--terra); border-color: var(--terra);
}
.karte.buchenkarte .kacheltitel { color: #fff; }
.buchenunter { font-size: 13px; color: rgba(255,255,255,.85); line-height: 1.4; }
.buchenpfeil {
  position: absolute; right: 14px; top: 50%; margin-top: -8px;
  display: inline-flex; transform: rotate(-90deg); opacity: .9;
}

</style>

const el = (tag, attrs = {}, ...kinder) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kinder.flat().forEach((c) => {
    if (c == null) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
};

const rein = (t) => String(t).replace(/<[^>]+>/g, "");
/* Steuerzeichen aus Blocktiteln: "## " Gruppe, "!! " Zusatzinformation. */
const ohneMarker = (t) => String(t).replace(/^(##|!!) /, "");

/* Zerlegt "<b>Titel:</b> Erklärung" in zwei Zeilen – alle Listen gleich aufgebaut. */
const zerlege = (p) => {
  if (typeof p !== "string") return p;
  const m = p.match(/^<b>([^<]{2,40}?)[:.]?<\/b>[\s:–—-]*(.+)$/);
  if (!m) return p;
  return { begriff: m[1].replace(/[:–—-]\s*$/, ""), text: m[2].trim() };
};

const linkZeile = ({ label, url, hinweis }) => {

/* Blöcke mit Sofortmassnahmen bekommen einen roten Rand und hellen Grund. */
const DRINGEND = ["sperren", "gestohlen", "verloren", "Notfall", "Denuncia", "Diebstahl"];
const NICHT_DRINGEND = ["kein Sperren", "was kein"];
const istDringend = (titel) => {
  const t = titel.toLowerCase();
  if (NICHT_DRINGEND.some((w) => t.includes(w.toLowerCase()))) return false;
  return DRINGEND.some((w) => t.includes(w.toLowerCase()));
};

/* Zeichnet die Blöcke eines Themas – "## Titel" wird zur Zwischenüberschrift. */
const bloeckeMit = (bloecke) => {
  const teile = [];
  let band = null;

  const neuesBand = (titel) => {
    /* Überschrift über der Fläche – wie die Wochenroutine auf der Startseite. */
    if (titel) teile.push(el("div", { class: "gruppentitel abstandoben klein3" }, titel));
    band = el("div", { class: "blockband" });
    teile.push(band);
  };

  bloecke.forEach(([t, p]) => {
    if (t.startsWith("## ")) { neuesBand(t.slice(3)); return; }
    const block = faltblock(t, p, false);
    /* Rot und Gelb stehen für sich, alles andere sammelt sich in seiner weissen Fläche. */
    if (t.startsWith("!! ") || istDringend(t)) { teile.push(block); band = null; return; }
    if (!band) neuesBand(null);
    band.appendChild(block);
  });
  return teile;
};

const faltblock = (titel, punkte, offenStart = false) => {
  const inhalt = el("ul", { class: "punkte" },
    punkte.map((roh) => {
      const p = zerlege(roh);
      if (typeof p === "string") return el("li", { html: p });
      if (p.begriff) return begriffZeile(p);
      if (p.sprung) return el("li", { class: "ohnepunkt" }, sprungZeile(p));
      return el("li", { class: "ohnepunkt" }, p.url ? linkZeile(p) : anrufZeile(p));
    }));
  const koerper = el("div", { class: "faltinhalt" + (offenStart ? " offen" : "") }, inhalt);
  const pfeil = el("span", { class: "faltpfeil" + (offenStart ? " auf" : "") },
    svg("chevron", 16, "#B08A78", 1.5));
  const zusatz = titel.startsWith("!! ");
  const reinTitel = zusatz ? titel.slice(3) : titel;
  const knopf = el("button", { class: "faltkopf", onclick: () => {
    const auf = koerper.classList.toggle("offen");
    pfeil.classList.toggle("auf", auf);
  } }, el("span", { class: "blocktitel ohneabstand" }, reinTitel), pfeil);
  return el("div", { class: "karte faltkarte"
    + (istDringend(reinTitel) ? " dringend" : "") + (zusatz ? " zusatz" : "") },
    knopf, koerper);
};

/* Verweist auf eine andere Stelle in der App – ein Tipp führt hin. */
/* Begriff mit Zusatztext – antippen öffnet die gelbe Erklärung darunter. */
const begriffZeile = (p) => {
  if (!p.mehr) {
    return el("li", {},
      el("span", { class: "begriff" }, p.begriff),
      el("span", { class: "begrifftext", html: p.text }));
  }
  const box = el("div", { class: "mehrbox" }, el("div", { class: "text", html: p.mehr }));
  const marke = el("span", { class: "mehrmarke" },
    el("span", { class: "mehrzeichen" }, "i"),
    el("span", { class: "mehrtext" }, p.mehrLabel || "Mehr dazu"));
  return el("li", { class: "mitmehr" },
    el("button", { class: "mehrknopfzeile", onclick: () => {
      const auf = box.classList.toggle("offen");
      marke.classList.toggle("auf", auf);
      marke.children[1].textContent = auf ? "Schliessen" : (p.mehrLabel || "Mehr dazu");
    } },
      el("span", { class: "begriff" }, p.begriff), marke),
    el("span", { class: "begrifftext", html: p.text }),
    box);
};

const sprungZeile = (p) =>
  el("button", { class: "sprung", onclick: () => gehe(p.sprung, p.param) },
    el("span", { class: "sprungtext" }, p.label),
    el("span", { class: "sprungpfeil" }, svg("chevron", 15, "#B65A3C", 2)));

const block = (titel, punkte) =>
  karte([
    el("div", { class: "blocktitel" }, titel),
    el("ul", { class: "punkte" },
      punkte.map((roh) => {
        const p = zerlege(roh);
        if (typeof p === "string") return el("li", { html: p });
        if (p.begriff) return begriffZeile(p);
        if (p.sprung) return el("li", { class: "ohnepunkt" }, sprungZeile(p));
        return el("li", { class: "ohnepunkt" }, p.url ? linkZeile(p) : anrufZeile(p));
      })),
  ], istDringend(titel) ? "dringend" : "weiss");

const reiter = (optionen, aktiv, aendern) =>

/* Aufklappbare Hakenliste: zugeklappt sieht man Titel und Stand. */
const faltHakenliste = (titel, punkte, schluessel, ruecksetzbar = false, wichtig = 0,
                        offenStart = false) => {
  const karteEl = hakenliste(titel, punkte, schluessel, ruecksetzbar, wichtig);
  const teile = Array.from(karteEl.children);
  const kopfzeile = teile[0];
  const rest = teile.slice(1);
  karteEl.innerHTML = "";

  const koerper = el("div", { class: "faltinhalt" + (offenStart ? " offen" : "") }, rest);
  const pfeil = el("span", { class: "faltpfeil" + (offenStart ? " auf" : "") },
    svg("chevron", 16, "#B08A78", 1.5));
  const knopf = el("button", { class: "faltkopf", onclick: () => {
    const auf = koerper.classList.toggle("offen");
    pfeil.classList.toggle("auf", auf);
  } }, kopfzeile, pfeil);

  karteEl.className = "karte faltkarte";
  karteEl.appendChild(knopf);
  karteEl.appendChild(koerper);
  return karteEl;
};

const hakenliste = (titel, punkte, schluessel, ruecksetzbar = false, wichtig = 0) => {
  const stand = hole("haken:" + schluessel, {});
  let eigene = hole("eigene:" + schluessel, []);
  let pruefeKnopfRef = null;

  const inhalt = el("div");
  const zaehler = el("div", { class: "klein" });

  /* Die Abschnitte einer Station – erscheinen direkt unter ihrer Zeile. */
  const stationsinhalt = (S) => {
    const box = el("div", { class: "stationsinhalt" });
    const LISTEN = {
      "abflug": ["Vor dem Abflug", VOR_ABFLUG],
      "vorreise": ["Wochen vorher erledigen", VOR_REISE],
      "ankunft": ["Ankunft im Hostel →", ANKUNFT],
      "ortswechsel": ["Ortswechsel", ORTSWECHSEL],
      "woche": ["Wochenroutine", WOCHE],
      "tour:rucksack": ["Tagesrucksack", TAGESRUCKSACK],
      "tour:vorher": ["← Hostel verlassen", VOR_DER_TOUR],
      "tour:tour": ["Tour", VOR_TOUR],
    };

    S.abschnitte.forEach(([titel, eintraege]) => {
      box.appendChild(el("div", { class: "gruppentitel abstandoben klein3" }, titel));
      const band = el("div", { class: "blockband" });
      eintraege.forEach((e) => {
        if (e[0] === "eigen") { band.appendChild(faltblock(e[1], e[2], false)); return; }
        if (e[0] === "liste") {
          const [name, punkte] = LISTEN[e[1]];
          band.appendChild(faltHakenliste(name, punkte, e[1], true));
          return;
        }
        if (e[0] === "hostels") {
          (LAENDER[e[1]].hostels || []).forEach((h) => band.appendChild(hostelKarte(h)));
          return;
        }
        holeBlock(e).forEach((b) => {
          if (String(b[0]).startsWith("## ")) return;
          band.appendChild(faltblock(ohneMarker(b[0]), b[1], false));
        });
      });
      box.appendChild(band);
    });
    return box;
  };

  const zeichne = () => {
    inhalt.innerHTML = "";
    const alle = punkte.concat(eigene);
    zaehler.textContent = alle.filter((p) => stand[p]).length + "/" + alle.length;

    alle.forEach((p, i) => {
      const selbst = i >= punkte.length;
      const zeile = el("div", {
        class: "hakenzeile" + (i === wichtig && wichtig > 0 ? " trennlinie" : ""),
      },
        el("button", {
          class: "haken" + (stand[p] ? " ab" : ""),
          onclick: () => {
            stand[p] = !stand[p];
            merke("haken:" + schluessel, stand);
            zeichne();
            if (pruefeKnopfRef) pruefeKnopfRef();
          },
        },
          el("span", { class: "box" + (stand[p] ? " an" : "") },
            stand[p] ? svg("check", 13, "#fff", 3) : null),
          el("span", { class: "hakentext" + (i < wichtig && !stand[p] ? " wichtig" : ""),
            html: p })));

      if (selbst) {
        zeile.appendChild(el("button", {
          class: "weg", "aria-label": "Punkt entfernen",
          onclick: () => {
            eigene = eigene.filter((x) => x !== p);
            delete stand[p];
            merke("eigene:" + schluessel, eigene);
            merke("haken:" + schluessel, stand);
            zeichne();
            if (pruefeKnopfRef) pruefeKnopfRef();
          },
        }, "×"));
      }
      inhalt.appendChild(zeile);
    });

    const feld = el("input", {
      class: "neufeld", placeholder: "Eigenen Punkt hinzufügen …",
      onkeydown: (e) => { if (e.key === "Enter") hinzu(); },
    });
    const hinzu = () => {
      const t = (feld.value || "").trim();
      if (!t || punkte.includes(t) || eigene.includes(t)) { feld.value = ""; return; }
      eigene = eigene.concat([t]);
      merke("eigene:" + schluessel, eigene);
      zeichne();
      const neuFeld = inhalt.querySelector(".neufeld");
      if (neuFeld) neuFeld.focus();
    };
    inhalt.appendChild(el("div", { class: "neuzeile" },
      el("span", { class: "plus" }, "+"), feld,
      el("button", { class: "textknopf", onclick: hinzu }, "hinzufügen")));
  };
  zeichne();

  const zuruecksetzen = el("button", { class: "ruecksetzen", onclick: () => {
    if (!confirm("Alle Haken dieser Liste entfernen?")) return;
    punkte.concat(eigene).forEach((p) => delete stand[p]);
    merke("haken:" + schluessel, stand);
    zeichne();
    pruefeKnopf();
  } }, "Alle Haken entfernen");

  const pruefeKnopf = () => {
    const fertig = punkte.concat(eigene).filter((p) => stand[p]).length;
    zuruecksetzen.style.display = (ruecksetzbar && fertig > 0) ? "block" : "none";
  };
  pruefeKnopfRef = pruefeKnopf;
  pruefeKnopf();

  return karte([
    el("div", { class: "zeile mitte" }, el("div", { class: "blocktitel" }, titel), zaehler),
    inhalt,
    zuruecksetzen,
  ]);
};

const hervor = (text, begriff) => {
  const i = flach(text).indexOf(flach(begriff));
  if (i < 0) return document.createTextNode(text);
  const von = Math.max(0, i - 40);
  const bis = Math.min(text.length, i + begriff.length + 70);
  const teil = (von > 0 ? "… " : "") + text.slice(von, bis) + (bis < text.length ? " …" : "");
  const j = flach(teil).indexOf(flach(begriff));
  const s = el("span");
  s.appendChild(document.createTextNode(teil.slice(0, j)));
  s.appendChild(el("mark", {}, teil.slice(j, j + begriff.length)));
  s.appendChild(document.createTextNode(teil.slice(j + begriff.length)));
  return s;
};

const seiteSuche = () => {
  const wrap = el("div");
  const ergebnis = el("div");
  const eingabe = el("input", {
    class: "suchfeld", placeholder: "Notpass, Automat, Impfung, Sámara …",
    oninput: (e) => zeichne(e.target.value.trim()),
  });

  const zeichne = (begriff) => {
    ergebnis.innerHTML = "";
    if (begriff.length < 2) {
      ergebnis.appendChild(karte(el("div", { class: "text" },
        "Durchsucht alles: Notfallnummern, Dokumente, Länderinfos, Hostels, Packliste, "
        + "Checklisten und die Route. Tippe auf einen Treffer, um an die Stelle zu springen.")));
      return;
    }
    const gesucht = flach(begriff);
    const erweitert = Object.entries(SYNONYME)
      .filter(([k]) => flach(k).includes(gesucht) || gesucht.includes(flach(k)))
      .map(([, v]) => flach(v).split(" ")).flat();

    const wort = (heu, nadel) =>
      new RegExp("(^|[^a-z0-9])" + nadel.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(heu);

    /* Handeln geht vor Nachschlagen: Notfall zuoberst, Packliste zuunterst. */
    const BEREICHSGEWICHT = { notfall: 4, geld: 3, wissen: 2, route: 2, buchen: 1, heute: 0 };

    const bewerte = (e) => {
      const alles = flach(`${e.titel} ${e.text} ${e.ort}`);
      let treffer = 0;
      if (flach(e.titel).includes(gesucht)) treffer = 3;
      else if (alles.includes(gesucht)) treffer = 2;
      else if (erweitert.some((w) => w.length > 3 && wort(alles, w))) treffer = 1;
      if (!treffer) return 0;
      return (BEREICHSGEWICHT[e.ziel.seite] ?? 0) * 4 + treffer;
    };

    const treffer = INDEX
      .map((e) => ({ e, p: bewerte(e) }))
      .filter((x) => x.p > 0)
      .sort((a, b) => b.p - a.p)
      .slice(0, 30)
      .map((x) => x.e);

    if (!treffer.length) {
      ergebnis.appendChild(karte(el("div", { class: "text" },
        "Nichts gefunden. Versuch ein anderes Wort – die Suche findet nur, was wörtlich "
        + "dasteht.")));
      return;
    }
    ergebnis.appendChild(el("div", { class: "klein abstandunten" },
      treffer.length + " Treffer" + (treffer.length === 40 ? " (weitere vorhanden)" : "")));
    treffer.forEach((t) => {
      ergebnis.appendChild(el("button", {
        class: "block", onclick: () => gehe(t.ziel.seite, t.ziel.param),
      }, karte([
        el("div", { class: "ortlabel" }, t.ort),
        el("div", { class: "treffertitel" }, hervor(t.titel, begriff)),
        t.text ? el("div", { class: "hinweis" }, hervor(t.text, begriff)) : null,
      ])));
    });
  };

  wrap.appendChild(kopf("Suchen", null, () => gehe(vorSuche)));
  wrap.appendChild(el("div", { class: "suchzeile" },
    svg("search", 18, "#B65A3C", 2), eingabe));
  wrap.appendChild(ergebnis);
  zeichne("");
  setTimeout(() => eingabe.focus(), 60);
  return wrap;
};

/* Wandelt ein Datum wie "5. Sep" in "morgen" oder "in 4 Tagen" um. */
const MONATE = { jan: 0, feb: 1, mrz: 2, apr: 3, mai: 4, jun: 5, jul: 6, aug: 7,
                 sep: 8, okt: 9, nov: 10, dez: 11 };

const alsTage = (datum) => {
  const m = datum.match(/^(\d{1,2})\.\s*([A-Za-zäöü]{3})/);
  if (!m) return null;
  const monat = MONATE[m[2].toLowerCase().slice(0, 3)];
  if (monat === undefined) return null;
  const heute = new Date();
  heute.setHours(0, 0, 0, 0);
  let jahr = heute.getFullYear();
  let ziel = new Date(jahr, monat, Number(m[1]));
  if (ziel < heute) ziel = new Date(jahr + 1, monat, Number(m[1]));
  return Math.round((ziel - heute) / 86400000);
};

const wannText = (datum) => {
  const t = alsTage(datum);
  if (t === null) return datum;
  if (t < 0) return "überfällig";
  if (t === 0) return "heute";
  if (t === 1) return "morgen";
  if (t <= 14) return "in " + t + " Tagen";
  return datum;
};

const termineKarte = (kopfNeu) => {
  const stand = hole("termine", {});
  let offen = null;
  let alle = false;
  const behaelter = el("div");

  /* Ein Termin gilt als erledigt, wenn alle seine Aufgaben abgehakt sind. */
  const aufgaben = (text) => (Array.isArray(text) ? text : [text]);
  const fertig = ([, titel, text]) => aufgaben(text).every((z) => stand[titel + "|" + z]);

  const zeichne = () => {
    behaelter.innerHTML = "";
    const offeneTermine = TERMINE.filter((t) => !fertig(t));
    const zeigen = alle ? TERMINE : offeneTermine.slice(0, 3);

    const karteEl = el("div", { class: "karte terminkarte" });
    zeigen.forEach(([datum, titel, text], i) => {
      const tage = alsTage(datum);
      const liste = aufgaben(text);
      const erledigt = liste.filter((z) => stand[titel + "|" + z]).length;
      const ganz = erledigt === liste.length;
      const dringend = tage !== null && tage <= 3 && !ganz;
      const zeile = el("div", { class: "terminzeile" + (i ? " mitlinie" : "") });

      zeile.appendChild(el("button", {
        class: "terminknopf",
        onclick: () => { offen = offen === titel ? null : titel; zeichne(); },
      },
        el("span", { class: "terminwann" + (dringend ? " bald" : "") }, wannText(datum)),
        el("span", { class: "terminwas" + (ganz ? " ab" : "") },
          titel + (offen === titel ? "" : " …"),
          liste.length > 1
            ? el("span", { class: "terminstand" }, erledigt + "/" + liste.length)
            : null)));

      if (offen === titel) {
        const block = el("div", { class: "terminaufgaben" });
        liste.forEach((z) => {
          const k = titel + "|" + z;
          block.appendChild(el("button", {
            class: "haken" + (stand[k] ? " ab" : ""),
            onclick: () => { stand[k] = !stand[k]; merke("termine", stand); zeichne(); },
          },
            el("span", { class: "box klein" + (stand[k] ? " an" : "") },
              stand[k] ? svg("check", 10, "#fff", 3) : null),
            el("span", { class: "termintext", html: z })));
        });
        zeile.appendChild(block);
      }
      karteEl.appendChild(zeile);
    });

    if (!zeigen.length) {
      karteEl.appendChild(el("div", { class: "text" },
        "Alles erledigt. Der nächste Termin erscheint, sobald du einen Haken entfernst."));
    }
    behaelter.appendChild(karteEl);
    if (kopfNeu) kopfNeu(alle);
  };
  zeichne();
  behaelter.umschalten = () => { alle = !alle; zeichne(); };
  return behaelter;
};

      class: "chip" + (tab === k ? " an" : "") + (k === "nummern" ? " chipalarm" : ""),
      onclick: () => { tab = k; zeichneReiter(); zeichne(); },
    }, l)));
    z.appendChild(zeile);
    return z;
  };
  wrap.appendChild(reiterZeile());
  wrap.appendChild(inhalt);

  const zeichneReiter = () => {
    wrap.querySelector(".notfallreiter").replaceWith(reiterZeile());
  };
  zeichne();
  return wrap;
};

/* Dieselbe Reihenfolge und Nummerierung wie die Register im Dossier. */
const WISSEN_REIHE = [
  ["01", "sicherheit"], ["02", "gesundheit"], ["05", "ablage"],
  ["06", "fluege"], ["06", "eda"],
];

const seiteWissen = () => {
  const offen = typeof param === "string" ? DOKUMENTE.find((d) => d.id === param) : null;

  if (offen) {
    return el("div", {},
      kopf(offen.titel, null, () => gehe("wissen"), "Wissen"),
      bloeckeMit(offen.bloecke));
  }

  const liste = WISSEN_REIHE
    .map(([nr, id]) => [nr, DOKUMENTE.find((d) => d.id === id)])
    .filter(([, d]) => d);
  return el("div", {},
    kopf("Wissen", "Einmal lesen, dann kennt man es.", null),
    el("div", { class: "spalten" },
    el("button", { class: "block", onclick: () => gehe("buchen") },
      el("div", { class: "karte buchenkarte" },
        el("div", { class: "kacheltitel klein2" }, "Buchen"),
        el("div", { class: "buchenunter" }, "Hostels, Busse, Schule, Formulare"),
        el("span", { class: "buchenpfeil" }, svg("chevron", 16, "#fff", 2)))),
      liste.map(([nr, d]) =>
        el("button", { class: "block", onclick: () => gehe("wissen", d.id) },
          karte(el("div", {},
            el("div", { class: "registernr" }, "Register " + nr),
            el("div", { class: "kacheltitel klein2" }, d.titel),
            el("div", { class: "hinweis" }, d.kurz)))))));
};

const GELD_REIHE = [["03", "geld"], ["02", "versicherung"], ["04", "handy"]];

const seiteGeld = () => {
  const offen = typeof param === "string" ? DOKUMENTE.find((d) => d.id === param) : null;
  if (offen) {
    return el("div", {},
      kopf(offen.titel, null, () => gehe("geld"), "Geld, Police & Handy"),
      bloeckeMit(offen.bloecke));
  }
  const liste = GELD_REIHE
    .map(([nr, id]) => [nr, DOKUMENTE.find((d) => d.id === id)])
    .filter(([, d]) => d);
  return el("div", {},
    kopf("Geld, Police & Handy", "Karten, Konten, Budget, Versicherung, Gerät.", null),
    liste.map(([nr, d]) =>
      el("button", { class: "block", onclick: () => gehe("geld", d.id) },
        karte(el("div", {},
          el("div", { class: "registernr" }, "Register " + nr),
          el("div", { class: "kacheltitel klein2" }, d.titel),
          el("div", { class: "hinweis" }, d.kurz))))));
};

const seiteBuchen = () =>
  el("div", {},
    kopf("Buchen", "Alle Plattformen an einem Ort. Öffnet die Seite im Browser.",
      () => gehe("wissen"), "Wissen"),
    el("div", { class: "spalten" }, BUCHEN.map(([t, p]) => block(t, p))),
    el("div", { class: "karte terra" },
      el("div", { class: "text", html:
        "<b>Nach jeder Buchung:</b> die Bestätigung als PDF in 04-02_Buchungsbestaetigungen "
        + "ablegen. Dann sieht sie deine Mutter auch – und du findest sie ohne Mailsuche "
        + "wieder." })));

const hostelKarte = (h) => {
  const details = el("div", { class: "verborgen" });
  if (h.gut) {
    details.appendChild(el("div", { class: "klein" }, "Dafür spricht"));
    h.gut.forEach((g) => details.appendChild(el("div", { class: "prozeile" },
      svg("check", 14, "#4E6B52", 2.5), el("span", {}, g))));
  }
  if (h.schlecht) {
    details.appendChild(el("div", { class: "klein abstandoben" }, "Dagegen spricht"));
    h.schlecht.forEach((x) => details.appendChild(el("div", { class: "prozeile" },
      el("span", { class: "minus" }, "–"), el("span", {}, x))));
  }
  const knopf = (h.gut || h.schlecht)
    ? el("button", {
      class: "textknopf abstandoben",
      onclick: (e) => {
        const auf = details.classList.toggle("offen");
        e.target.textContent = auf ? "Weniger" : "Was Gäste schreiben";
      },
    }, "Was Gäste schreiben") : null;

  return el("div", { class: "karte" + (h.tipp ? " tipp" : "") },
    el("div", { class: "zeile luecke" },
      el("div", { class: "min0" },
        h.tipp ? el("div", { class: "ortlabel" }, h.tipp) : null,
        el("div", { class: "kacheltitel klein2" }, h.name),
        el("div", { class: "hinweis" }, h.ort),
        h.note ? el("div", { class: "notiz" }, h.note) : null),
      el("div", { class: "knopfreihe" },
        el("a", { href: telLink(h.tel), class: "rundknopf" }, svg("phone", 16, "#fff", 2.2)),
        h.web ? el("a", { href: h.web, target: "_blank", rel: "noopener", class: "rundknopf hell" },
          svg("link", 16, "#B65A3C", 2.2)) : null,
        el("a", {
          href: "https://www.hostelworld.com/search?search_keywords=" + encodeURIComponent(h.name),
          target: "_blank", rel: "noopener", class: "rundknopf hell",
        }, svg("bed", 16, "#B65A3C", 2)))),
    knopf, details);
};

const seiteRoute = () => {
  const wrap = el("div");
  const inhalt = el("div");
  let tab = (param && param.tab) || "etappen";
  let station = (param && param.station) || null;
  let land = (param && param.land) || "guatemala";

  const farbe = { guatemala: "gt", costarica: "cr" };

  /* Flaggen als Vektorgrafik – auf jedem Gerät gleich. */
  const flagge = (schluessel) => {
    const rahmen = (inneres) => {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 21 14");
      s.setAttribute("width", "22");
      s.setAttribute("height", "15");
      s.setAttribute("class", "flagge");
      s.innerHTML = inneres
        + '<rect x=".25" y=".25" width="20.5" height="13.5" fill="none"'
        + ' stroke="rgba(0,0,0,.18)" stroke-width=".5"/>';
      return s;
    };
    if (schluessel === "guatemala") {
      return rahmen('<rect width="7" height="14" fill="#4997D0"/>'
        + '<rect x="7" width="7" height="14" fill="#fff"/>'
        + '<rect x="14" width="7" height="14" fill="#4997D0"/>'
        + '<circle cx="10.5" cy="7" r="2.1" fill="none" stroke="#4E6B52" stroke-width=".7"/>');
    }
    if (schluessel === "costarica") {
      return rahmen('<rect width="21" height="14" fill="#002B7F"/>'
        + '<rect y="2.8" width="21" height="8.4" fill="#fff"/>'
        + '<rect y="4.9" width="21" height="4.2" fill="#CE1126"/>');
    }
    return rahmen('<rect width="7" height="14" fill="#D91023"/>'
      + '<rect x="7" width="7" height="14" fill="#fff"/>'
      + '<rect x="14" width="7" height="14" fill="#D91023"/>');
  };

  /* Holt einen Block dort, wo er einmal steht – nichts wird kopiert. */
  const holeBlock = (v) => {
    if (v[0] === "land") {
      const L = LAENDER[v[1]];
      const b = L.bloecke.find(([t]) => ohneMarker(t) === v[2]);
      return b ? [[b[0], b[1]]] : [];
    }
    const D = DOKUMENTE.find((x) => x.id === v[1]);
    if (!D) return [];
    if (v.length === 2) return D.bloecke;
    const b = D.bloecke.find(([t]) => ohneMarker(t) === v[2]);
    return b ? [[b[0], b[1]]] : [];
  };

  /* Die Abschnitte einer Station – erscheinen direkt unter ihrer Zeile. */
  const stationsinhalt = (S) => {
    const box = el("div", { class: "stationsinhalt" });
    const LISTEN = {
      "abflug": ["Vor dem Abflug", VOR_ABFLUG],
      "vorreise": ["Wochen vorher erledigen", VOR_REISE],
      "ankunft": ["Ankunft im Hostel →", ANKUNFT],
      "ortswechsel": ["Ortswechsel", ORTSWECHSEL],
      "woche": ["Wochenroutine", WOCHE],
      "tour:rucksack": ["Tagesrucksack", TAGESRUCKSACK],
      "tour:vorher": ["← Hostel verlassen", VOR_DER_TOUR],
      "tour:tour": ["Tour", VOR_TOUR],
    };

    S.abschnitte.forEach(([titel, eintraege]) => {
      box.appendChild(el("div", { class: "gruppentitel abstandoben klein3" }, titel));
      const band = el("div", { class: "blockband" });
      eintraege.forEach((e) => {
        if (e[0] === "eigen") { band.appendChild(faltblock(e[1], e[2], false)); return; }
        if (e[0] === "liste") {
          const [name, punkte] = LISTEN[e[1]];
          band.appendChild(faltHakenliste(name, punkte, e[1], true));
          return;
        }
        if (e[0] === "hostels") {
          (LAENDER[e[1]].hostels || []).forEach((h) => band.appendChild(hostelKarte(h)));
          return;
        }
        holeBlock(e).forEach((b) => {
          if (String(b[0]).startsWith("## ")) return;
          band.appendChild(faltblock(ohneMarker(b[0]), b[1], false));
        });
      });
      box.appendChild(band);
    });
    return box;
  };

  const zeichne = () => {
    inhalt.innerHTML = "";

    if (tab === "land") {
      const L = LAENDER[land];
      inhalt.appendChild(el("button", { class: "zurueckzeile",
        onclick: () => { tab = "etappen"; zeichne(); } },
        el("span", { class: "zurueckpfeil" }, svg("chevron", 16, "#B65A3C", 2)),
        el("span", {}, "Route")));
      inhalt.appendChild(el("div", { class: "landtitel" }, L.name));
      if (land === "guatemala" && typeof KARTE_GT !== "undefined") {
        inhalt.appendChild(el("div", { class: "karte bild" },
          el("img", { src: KARTE_GT, alt: "Karte Guatemala" })));
      }
      if (land === "costarica" && typeof KARTE_CR !== "undefined") {
        inhalt.appendChild(el("div", { class: "karte bild" },
          el("img", { src: KARTE_CR, alt: "Karte Costa Rica" })));
        inhalt.appendChild(linkZeile({
          label: "Visit Costa Rica – offizielles Tourismusportal",
          url: "https://de.visitcostarica.com/",
          hinweis: "Auf Deutsch, vom Tourismusinstitut ICT",
        }));
      }
      bloeckeMit(L.bloecke).forEach((x) => inhalt.appendChild(x));
      if (L.hostels && L.hostels.length) {
        inhalt.appendChild(el("div", { class: "gruppentitel abstandoben klein3" }, "Hostels"));
        const band = el("div", { class: "blockband" });
        L.hostels.forEach((h) => band.appendChild(hostelKarte(h)));
        inhalt.appendChild(band);
      }
      return;
    }

    /* Die Route als Zeitachse */
    inhalt.appendChild(el("div", { class: "hinweis abstandunten" },
      "Nur was feststeht. Antippen öffnet alles, was für diese Station gilt."));

    let letztes = null;
    let strang = null;
    STATIONEN.forEach((S) => {
      const k = S.land || "peru";
      if (k !== letztes) {
        /* Drei Zeilen wie bei den Stationen: Name, Zeitraum, Kurzbeschrieb. */
        const L = S.land ? LAENDER[S.land] : null;
        const name = L ? L.name : "Peru";
        const klasse = S.land ? farbe[S.land] : "pe";
        const dreizeiler = () => el("div", { class: "landtext" },
          el("div", { class: "landzeile" },
            el("span", { class: "landname " + klasse }, name),
            flagge(S.land || "peru")),
          el("div", { class: "landzeit" }, L ? L.zeit : "Ende Dezember, offen"),
          el("div", { class: "hinweis" },
            L ? L.kurz : "Mit einer Freundin, noch nichts gebucht"));

        if (S.land) {
          inhalt.appendChild(el("button", { class: "landmarke landknopf",
            onclick: () => { tab = "land"; land = S.land; zeichne(); } },
            dreizeiler(),
            el("span", { class: "landpfeil" }, svg("chevron", 15, "#B65A3C", 2))));
        } else {
          inhalt.appendChild(el("div", { class: "landmarke" }, dreizeiler()));
        }

        /* Tourismusportal des Landes – schmale Zeile unter der Ländermarke. */
        if (S.land === "costarica") {
          inhalt.appendChild(el("a", {
            href: "https://de.visitcostarica.com/", target: "_blank", class: "portalzeile" },
            el("span", { class: "portaltext" },
              "Visit Costa Rica – Tourismusportal auf Deutsch"),
            svg("link", 14, "#4E6B52", 1.8)));
        }
        strang = el("div", { class: "strang" });
        inhalt.appendChild(strang);
        letztes = k;
      }
      const unbestimmt = /offen|noch nicht/i.test(S.zeit + S.kurz);
      const auf = station === S.id;
      strang.appendChild(el("button", { class: "etappe etappeknopf" + (auf ? " auf" : ""),
        onclick: () => { station = auf ? null : S.id; zeichne(); } },
        el("span", { class: "punkt" + (unbestimmt ? " offen" : "") }, S.nummer),
        el("div", { class: "etappenort" }, S.titel),
        el("div", { class: "etappenzeit" }, S.zeit),
        el("div", { class: "hinweis" }, S.kurz),
        el("span", { class: "etappepfeil" + (auf ? " auf" : "") },
          svg("chevron", 16, "#B65A3C", 2))));
      if (auf) strang.appendChild(stationsinhalt(S));
    });
  };

  wrap.appendChild(kopf("Route", "Von der Anreise bis zur Rückkehr", null));
  wrap.appendChild(inhalt);
  zeichne();
  return wrap;
};


/* ── Navigation ────────────────────────────────────────────────── */

const BEREICHE = [
  ["start", "Start", "home"],
  ["route", "Route", "map", true],
  ["heute", "Heute", "check"],
  ["geld", "Geld", "wallet"],
  ["wissen", "Wissen", "book"],
];

function gehe(ziel, p = null) {
  if (seite !== "suche") vorSuche = seite;
  seite = ziel;
  param = p;
  zeichnen();
  window.scrollTo(0, 0);
}

function leiste() {
  return el("nav", { class: "tableiste" },
    BEREICHE.map(([k, l, ikon, wichtig]) => {
      const aktiv = seite === k || (seite === "suche" && vorSuche === k);
      /* Die Route ist der Hauptweg – sie bleibt auch inaktiv farbig. */
      /* Terracotta bleibt der Route vorbehalten – die aktive Seite wird dunkler. */
      const farbe = wichtig ? "#B65A3C" : (aktiv ? "#2B2723" : "#8B8175");
      return el("button", {
        class: "tab" + (aktiv ? " an" : "") + (wichtig ? " wichtig" : ""),
        onclick: () => gehe(k),
      }, svg(ikon, wichtig ? 23 : 21, farbe, aktiv ? 2.2 : (wichtig ? 2.2 : 1.7)),
         el("span", { style: "color:" + farbe }, l));
    }));
}

function zeichnen() {
  app.innerHTML = "";
  ["topbar", "startkopf"].forEach((id) => {
    const alt = document.getElementById(id);
    if (alt) alt.remove();
  });
  const seiten = {
    start: seiteStart, heute: seiteHeute, suche: seiteSuche, notfall: seiteNotfall,
    buchen: seiteBuchen, route: seiteRoute, geld: seiteGeld, wissen: seiteWissen,
  };
  if (seite !== "start" && seite !== "suche") {
    document.body.insertBefore(el("div", { class: "kopfzeile", id: "topbar" },
      el("span", { class: "platzhalter" }),
      seite === "notfall" ? el("span") : el("button", {
        class: "notknopf", onclick: () => gehe("notfall"),
      }, svg("shield", 17, "#A8322A", 2), el("span", {}, "Notfall")),
      el("button", {
        class: "lupe", "aria-label": "Suchen",
        onclick: () => { vorSuche = seite; seite = "suche"; zeichnen(); window.scrollTo(0, 0); },
      }, svg("search", 18, "#B65A3C", 2))), app);
  }
  app.appendChild((seiten[seite] || seiteStart)());
  app.appendChild(leiste());
}

zeichnen();

</script>
