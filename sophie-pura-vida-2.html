<title>Sophie Pura Vida</title>
<style>
:root {
  /* ═══ Ebenen – die einzigen erlaubten Schriftgrössen ═══
     Eine Überschrift steht nie auf derselben oder einer tieferen Ebene
     als das, was unter ihr steht.

     Ebene 1  30px  Titelbild auf der Startseite
     Ebene 2  24px  Seitentitel
     Ebene 3  19px  Ländername, Bereichsüberschrift
     Ebene 4  16px  Gruppentitel, Ortsname, Kachel
     Ebene 5  14px  Fliesstext, Listeneintrag, Blocktitel
     Ebene 6  12.5px Hinweis, Legende, Zähler
     Ebene 7  11px  Etikett, untere Leiste
  */
  --ebene1: 30px;
  --ebene2: 24px;
  --ebene3: 19px;
  --ebene4: 16px;
  --ebene5: 14px;
  --ebene6: 12.5px;
  --ebene7: 11px;

  --sand: #EFE7DA;
  --sand-tief: #E3D8C6;
  --karte: #FFFFFF;
  --ink: #2B2723;
  --grau: #8B8175;
  --terra: #B65A3C;
  --terra-hell: #F3E2DA;
  --alarm: #A8322A;
  --alarm-hell: #F6DEDA;
  --linie: #DED2BF;
  --navy: #1F3864;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  width: 100%; max-width: 100%;
  /* Kein overflow auf html/body – sonst klebt nichts mehr beim Scrollen. */
}


body {
  background: var(--sand);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--ebene4);
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 20px;
}

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img { max-width: 100%; display: block; }
mark { background: #F6E7B0; color: var(--ink); padding: 0 2px; border-radius: 2px; }

/* ── Grundelemente ── */

.block { display: block; width: 100%; text-align: left; }
.zeile { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.zeile.mitte { align-items: baseline; }
.zeile.luecke { justify-content: flex-start; gap: 10px; }
.min0 { min-width: 0; }
.ikon { display: inline-flex; align-items: center; }
.verborgen { display: none; }
.verborgen.offen { display: block; margin-top: 14px; }
.abstandoben { margin-top: 30px; }
.abstandunten { margin-bottom: 12px; }
.vorzeile { white-space: pre-line; }
.brechen { word-break: break-all; }

.karte {
  background: var(--karte);
  border: 1px solid var(--linie);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
}
.karte.terra { background: var(--terra-hell); border-color: #E8CFC3; }
.karte.alarm { background: var(--alarm-hell); border-color: #EBC6C0; }
.karte.tipp { border-color: var(--terra); }
.karte.bild { padding: 0; overflow: hidden; }
.polster { padding: 10px 14px; }

.klein { font-size: var(--ebene6); color: var(--grau); }
.klein2 { font-size: var(--ebene4); }
.hinweis { font-size: var(--ebene6); color: var(--grau); line-height: 1.5; }
.text { font-size: var(--ebene5); line-height: 1.6; }
.notiz { font-size: var(--ebene6); color: var(--terra); margin-top: 5px; }
.fussnote { font-size: var(--ebene7); color: var(--grau); line-height: 1.5; margin-top: 18px; }

/* ── Kopfbereich ── */

.kopfzeile {
  position: sticky; top: 0; z-index: 60;
  max-width: 480px; margin: 0 auto;
  display: block;
  padding-top: 12px; padding-bottom: 10px;
  padding-left: max(20px, env(safe-area-inset-left));
  padding-right: max(20px, env(safe-area-inset-right));
  background: var(--sand);
  border-bottom: 1px solid rgba(43, 39, 35, .08);
}
.platzhalter { width: 40px; flex-shrink: 0; }
/* Beim Scrollen sichtbar: auf welchem Bildschirm man ist */
.seitenname {
  display: inline-flex; align-items: center; gap: 7px;
  min-width: 40px; flex-shrink: 0;
  font-size: var(--ebene4); font-weight: 600; color: #211C18;
  letter-spacing: -.01em;
}
/* Ohne grossen Titel: die Zeile darunter beginnt höher */
.kopf.ohnetitel { margin-top: 0; margin-bottom: 18px; }
#app > div > *:first-child { margin-top: 6px; }
.kopf.ohnetitel .unter { margin-top: 0; }
.notknopf {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--alarm-hell); border: 1px solid #EBC6C0;
  border-radius: 99px; padding: 7px 14px 7px 11px;
  font-size: var(--ebene6); color: var(--alarm); font-weight: 500;
}
.lupe {
  width: 40px; height: 40px; border-radius: 20px;
  background: var(--karte); border: 1px solid var(--linie);
  display: flex; align-items: center; justify-content: center;
}

.kopf { margin-bottom: 24px; margin-top: 6px; }
.kopf h1 {
  font-weight: 600; font-size: var(--ebene3); line-height: 1.15; margin: 0; color: #211C18; }
.kopf .unter { font-size: var(--ebene5); color: var(--grau); margin: 8px 0 0; line-height: 1.55; }
.zurueck {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--terra); font-size: var(--ebene5); margin-bottom: 16px;
}

.titelblock { padding: 4px 0 14px; }
.obertitel { font-size: var(--ebene6); color: var(--grau); letter-spacing: 0.14em; text-transform: uppercase; }
.gross {
  font-weight: 700; font-size: var(--ebene1); line-height: 1.05; margin: 6px 0 0; color: var(--ink); }
.strich { width: 48px; height: 3px; background: var(--terra); border-radius: 2px; margin: 10px 0; }

/* ── Startseite ── */

.alarmkachel {
  display: block; width: 100%; text-align: left;
  background: var(--alarm-hell); border: 1px solid #EBC6C0;
  border-radius: 16px; padding: 18px; margin-bottom: 14px;
}
.alarmtitel {
  font-weight: 700; font-size: var(--ebene2); color: var(--alarm); }
.alarmtext { font-size: var(--ebene6); color: #8B5A52; margin-top: 7px; line-height: 1.45; }

.raster { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kachel {
  background: var(--karte); border: 1px solid var(--linie);
  border-radius: 16px; padding: 14px 16px; text-align: left;
}
.kacheltitel {
  font-weight: 600; font-size: var(--ebene4); line-height: 1.2; margin-bottom: 5px; }

/* ── Rundknöpfe ── */

.rundknopf {
  width: 38px; height: 38px; border-radius: 19px; background: var(--terra);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.rundknopf.klein { width: 36px; height: 36px; }
.rundknopf.gross { width: 46px; height: 46px; border-radius: 23px; }
.rundknopf.alarm { background: var(--alarm); }
.rundknopf.hell { background: var(--terra-hell); }
.knopfreihe { display: flex; gap: 8px; flex-shrink: 0; }

.nummer {
  font-weight: 600; font-size: var(--ebene3); margin-top: 2px; }
.nummer.alarm { color: var(--alarm); }
.satz { font-size: var(--ebene3); margin-top: 4px; }

/* ── Aktionsfelder in Textblöcken ── */

.aktionsfeld {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--terra-hell); border: 1px solid #E8CFC3;
  border-radius: 12px; padding: 12px 14px; margin-top: 10px;
}
.aktionswert { font-size: var(--ebene3); margin-top: 2px; line-height: 1.35; }
.leerfeld {
  background: var(--sand); border: 1px dashed var(--linie);
  border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-size: var(--ebene6);
}

/* ── Textblöcke ── */

.blocktitel {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: var(--ebene5); font-weight: 500; color: var(--ink); margin-bottom: 10px;
}
.abschnitt {
  font-weight: 600; font-size: var(--ebene4); }
.punkte li {
  position: relative; padding-left: 18px; font-size: var(--ebene5); line-height: 1.55; margin-bottom: 10px;
}
.punkte li::before {
  content: ""; position: absolute; left: 0; top: 8px;
  width: 5px; height: 5px; border-radius: 5px; background: var(--terra);
}
.punkte li.ohnepunkt { padding-left: 0; }
.punkte li.ohnepunkt::before { display: none; }
.punkte li:last-child { margin-bottom: 0; }

.schritte li { display: flex; gap: 12px; margin-bottom: 12px; }
.schritte .ziffer {
  width: 22px; height: 22px; border-radius: 11px; background: var(--terra); color: #fff;
  font-size: var(--ebene6); display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.schritte b { font-size: var(--ebene5); display: block; }
.schritte .hinweis { display: block; margin-top: 3px; }

/* ── Reiter ── */

.reiter { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.chip {
  padding: 8px 16px; border-radius: 999px; font-size: var(--ebene6);
  border: 1px solid var(--linie); color: var(--grau);
}
.chip.an { background: var(--ink); color: var(--sand); border-color: var(--ink); }
.notfallknopf {
  width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--alarm-hell); border: 1px solid #EBC6C0;
}
.notfallknopf.an { background: var(--alarm); border-color: var(--alarm); }

.landwahl { display: flex; gap: 8px; margin-bottom: 16px; }
.landknopf {
  flex: 1; padding: 10px; border-radius: 12px; font-size: var(--ebene5);
  border: 1px solid var(--linie); color: var(--grau);
}
.landknopf.an { color: #fff; }

/* ── Haken ── */

.haken { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 8px 0; text-align: left; }
.haken .box {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--linie);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
}
.haken .box.an { background: var(--terra); border-color: var(--terra); }
.hakentext { font-size: var(--ebene5); line-height: 1.45; }
.haken.ab .hakentext { color: var(--grau); text-decoration: line-through; }

/* ── Eingaben ── */

.suchzeile {
  display: flex; align-items: center; gap: 12px; background: var(--karte);
  border: 1px solid var(--linie); border-radius: 16px; padding: 12px 16px; margin-bottom: 20px;
}
.suchfeld { flex: 1; border: 0; outline: none; background: none; font-size: var(--ebene4); color: var(--ink); }
.feld { display: block; margin-bottom: 16px; }
.feld input {
  width: 100%; margin-top: 5px; padding: 10px 12px; font-size: var(--ebene4);
  border: 1px solid var(--linie); border-radius: 12px; background: var(--sand); color: var(--ink);
}
.textknopf { color: var(--terra); font-size: var(--ebene6); }

/* ── Suchtreffer ── */

.ortlabel {
  font-size: var(--ebene7); color: var(--terra); letter-spacing: 0.06em;
  text-transform: uppercase; margin-bottom: 4px;
}
.ortlabel.grau { color: var(--grau); letter-spacing: 0.1em; }
.treffertitel {
  font-weight: 600; font-size: var(--ebene4); line-height: 1.3; margin-bottom: 5px; }

/* ── Hostels ── */

.prozeile { display: flex; gap: 10px; font-size: var(--ebene5); line-height: 1.5; margin-bottom: 6px; }
.prozeile .ikon { margin-top: 3px; flex-shrink: 0; }
.minus { color: var(--alarm); font-size: var(--ebene4); flex-shrink: 0; }

/* ── Route ── */

.zeitstrahl { position: relative; padding-left: 26px; }
/* Die Zeitachse steht auf weisser Fläche wie alle anderen Inhalte. */
.strang {
  position: relative; padding: 16px 14px 4px 44px;
  background: var(--karte); border: 1px solid var(--linie); border-radius: 14px;
  margin-bottom: 16px;
}
.strang::before {
  content: ""; position: absolute; left: 23px; top: 26px; bottom: 26px;
  width: 2px; background: var(--sand-tief);
}
.etappe { position: relative; margin-bottom: 16px; }
.etappe:last-child { margin-bottom: 12px; }

/* In der weissen Zeitachse brauchen die Blöcke eine eigene Tönung,
   sonst verschwimmen weisse Karten auf weissem Grund. */
.strang .blockband {
  background: var(--sand); border-color: #E0D5C2;
}
.strang .karte:not(.faltkarte):not(.dringend):not(.zusatz) {
  background: var(--sand); border-color: #E0D5C2;
}
.stationsinhalt .gruppentitel.klein3 { margin-top: 16px; }

/* Geöffnete Station: eigene Fläche, damit man sieht, wozu die Liste gehört */
.etappeknopf.auf {
  background: var(--sand); border-radius: 12px;
  margin-left: -10px; margin-right: -6px; padding: 8px 10px 10px;
  margin-bottom: 4px;
}
.etappeknopf.auf .punkt { left: -20px; }
.stationsinhalt {
  /* Ohne Linie – die sandfarbene Kopfzeile zeigt schon, wozu der Inhalt gehört. */
  margin: 0 0 18px; padding-left: 0;
}
.etappe .punkt {
  position: absolute; left: -29px; top: 4px; width: 19px; height: 19px; border-radius: 10px;
  background: var(--terra); border: 2px solid var(--terra);
  color: #fff; font-size: 10.5px; font-weight: 600; line-height: 16px; text-align: center;
}
.etappe .punkt.offen { background: var(--sand); border-color: var(--grau); color: var(--grau); }
.etappenort {
  font-weight: 500; font-size: var(--ebene4); color: #211C18; margin: 3px 0 4px; }


/* ── Aufklappbare Blöcke: leichte Zeilen statt Karten ── */
.blockband {
  background: var(--karte); border: 1px solid #E6DCCB; border-radius: 12px;
  overflow: hidden; margin-bottom: 14px; padding: 6px 0;
}
.bandtitel {
  font-weight: 600;
  font-size: var(--ebene4); line-height: 1.15; color: var(--ink);
  padding: 12px 14px 7px; margin: 0 14px 5px 22px;
  border-bottom: 1px solid var(--linie); padding-left: 0; padding-right: 0;
}
.faltkarte {
  padding: 0; background: none; border: 0; border-radius: 0; margin: 0;
}
.faltkopf {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; padding: 6px 15px; text-align: left;
}
.blocktitel.ohneabstand { margin-bottom: 0; }
.faltpfeil { display: inline-flex; flex-shrink: 0; transition: transform .15s; }
.faltpfeil.auf { transform: rotate(180deg); }
.faltinhalt { display: none; padding: 0 14px 11px; }

/* Sofortmassnahme und Zusatzinformation behalten ihre Fläche */
.karte.faltkarte.dringend, .karte.faltkarte.zusatz {
  border: 1px solid; border-radius: 12px; margin: 4px 0 10px;
}
.karte.faltkarte.dringend { background: var(--alarm-hell); border-color: #EBC6C0; }
.karte.faltkarte.zusatz { background: #FBF3DC; border-color: #EBDFBC; }
.karte.faltkarte.dringend .faltkopf,
.karte.faltkarte.zusatz .faltkopf { padding: 13px 14px; }
.karte.faltkarte.dringend .faltinhalt,
.karte.faltkarte.zusatz .faltinhalt { padding: 0 14px 14px; }
.faltinhalt.offen { display: block; }

.begriff { display: block; font-size: var(--ebene5); font-weight: 600; line-height: 1.45; }
.begrifftext { display: block; font-size: var(--ebene5); color: var(--grau); margin-top: 2px; line-height: 1.5; }

.banner { border: 1px solid var(--linie); border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
.banner img { display: block; width: 100%; height: 92px; object-fit: cover; object-position: center 42%; }
.puravida { color: var(--terra); }

.listenfuss {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-top: 1px solid var(--linie); margin-top: 10px; padding-top: 2px;
}
.kopierknopf { padding: 10px 0; min-height: 40px; }
.listenfuss .ruecksetzen { margin-top: 0; }
.ruecksetzen { display: none; margin-top: 12px; font-size: var(--ebene6); color: var(--grau); }

.gruppenzeile {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 2px 0 8px;
}
.gruppentitel {
  font-size: var(--ebene7); color: var(--grau); letter-spacing: .08em; text-transform: uppercase;
}
/* Grössenordnung der App:
   Seitentitel 30 · Bereich 19 · Block 15 · Text 14 · Hinweis 13 · Etikett 11.
   Eine Überschrift ist nie kleiner als das, was unter ihr steht. */
.gruppentitel.klein3 {
  font-size: var(--ebene4); letter-spacing: 0;
  text-transform: none; color: #211C18; font-weight: 600;
  margin: 0 0 7px 3px;
}
.zuknopf { font-size: var(--ebene6); color: var(--terra); }
.mehrknopf { font-size: var(--ebene6); color: var(--grau); margin: -8px 0 20px; display: block; }

.titelzeile { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.titelzeile .lupe { margin-top: 2px; flex-shrink: 0; }

/* ── Kopfbild mit Titel darunter ── */
.held {
  background: var(--karte); border: 1px solid var(--linie); border-radius: 14px;
  overflow: hidden; contain: content; margin: 18px 0 16px;
}
.held img { display: block; width: 100%; height: auto; aspect-ratio: 11 / 5; }
.heldtext {
  padding: 18px; box-shadow: inset 0 1px 0 rgba(0,0,0,.06);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
/* Der Titel trägt die Hausfarbe, der Untertitel bleibt warmes Grau. */
.heldtitel {
  font-weight: 700; font-size: var(--ebene1); color: var(--terra); line-height: 1.15; }
.heldunter { font-size: var(--ebene5); line-height: 1.5; color: #5A524C; margin-top: 8px; }
.heldlupe {
  /* 44 Punkte Trefferfläche, sichtbarer Kreis 34 Punkte. */
  width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; margin-top: 21px;
  position: relative; background: transparent; border: 0;
  display: flex; align-items: center; justify-content: center;
}

/* ── Leiste unten ── */
.tableiste {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; max-width: 480px; margin: 0 auto;
  background: rgba(255, 253, 250, .92);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  backdrop-filter: saturate(180%) blur(14px);
  border-top: 0.5px solid rgba(43, 39, 35, .12);
  padding: 6px 2px calc(7px + env(safe-area-inset-bottom));
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: var(--ebene7); padding: 3px 0;
}
/* Alle Reiter gleich – die aktive Seite zeigt sich nur über die Farbe. */
.tab span { font-weight: 400; }
.tab.an span { font-weight: 500; }
#app { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }

.termindatum {
  width: 62px; flex-shrink: 0; font-size: var(--ebene7); color: var(--terra);
  letter-spacing: .04em; text-transform: uppercase;
}

/* ── Eigene Punkte in Checklisten ── */
.hakenzeile { display: flex; align-items: flex-start; }
.hakenzeile .haken { flex: 1; }
.weg {
  width: 30px; align-self: center; font-size: var(--ebene3); line-height: 1;
  color: var(--grau); flex-shrink: 0;
}
.neuzeile {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
  padding-top: 10px; border-top: 0.5px solid var(--linie);
}
.plus { color: var(--terra); font-size: var(--ebene4); width: 20px; text-align: center; flex-shrink: 0; }
.neufeld {
  flex: 1; border: 0; outline: none; background: none;
  font-size: var(--ebene5); color: var(--ink); padding: 4px 0;
}
.neufeld::placeholder { color: var(--grau); }

/* ── Meldeformular ── */
.meldezeile { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
.meldewert { font-size: var(--ebene5); text-align: right; }
.meldeleer { font-size: var(--ebene6); color: var(--grau); font-style: italic; text-align: right; }
.meldelabel { display: block; margin-bottom: 14px; }
.meldehilfe { display: block; font-size: var(--ebene7); color: var(--grau); margin-top: 1px; }
.meldefeld {
  width: 100%; margin-top: 5px; padding: 9px 11px; font-size: var(--ebene4);
  border: 1px solid var(--linie); border-radius: 10px;
  background: var(--sand); color: var(--ink); font-family: inherit; resize: vertical;
}
.meldeknoepfe { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.meldeknopf {
  background: var(--karte); border: 1px solid #E8CFC3; border-radius: 12px;
  padding: 12px 14px; font-size: var(--ebene5); color: var(--ink); text-align: left;
}
.ruecksetzen.sichtbar { display: block; }

.version { display: none; }

/* Startseite: Bild und Notfall bleiben oben, nur die Termine scrollen. */
.startkopf {
  max-width: 480px; margin: 0 auto;
  padding: 0 max(20px, env(safe-area-inset-left)) 6px;
}

/* Schmale Notfallleiste auf der Startseite */
/* Hero, Notfall und Termine als eine Gruppe – enger beieinander. */
.notfallzeile { display: flex; justify-content: flex-end; margin-top: 14px; margin-bottom: 0; }
.notfallleiste {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--alarm-hell); border: 1px solid #EBC6C0;
  border-radius: 12px; padding: 9px 9px 9px 15px;
}
.notfallwort { font-size: var(--ebene4); color: var(--alarm); }
.rundknopf.alarm.klein { width: 32px; height: 32px; border-radius: 16px; }
.notfallpfeil { display: inline-flex; transform: rotate(-90deg); opacity: .7; }

.hakentext.wichtig { font-weight: 600; }
.hakenzeile.trennlinie { border-top: 1px solid var(--linie); margin-top: 6px; padding-top: 6px; }

.mehrwoche { display: block; margin-top: -4px; }


/* ══ Breite Bildschirme: zwei Spalten statt schmaler Säule ══════════ */
@media (min-width: 900px) {
  #app {
    max-width: 1080px;
    padding: 0 40px calc(96px + env(safe-area-inset-bottom));
  }

  .kopfzeile { max-width: 1080px; padding-left: 40px; padding-right: 40px; }
  .startkopf { max-width: 1080px; padding-left: 40px; padding-right: 40px; }
  .tableiste { max-width: 1080px; }

  /* Startseite: Bild links, Notfall und Termine rechts */
  .startkopf { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; align-items: start; }
  .startkopf .held { margin: 10px 0 0; }
  .startkopf .notfallleiste { margin-top: 10px; }

  /* Inhalte zweispaltig fliessen lassen */
  .spalten {
    column-count: 2; column-gap: 28px;
  }
  .spalten > * { break-inside: avoid; }

  .held img { height: auto; }
  .heldtitel { font-size: var(--ebene1); }

  /* Leiste unten bekommt mehr Luft */
  .tab { font-size: var(--ebene6); }
  .tab svg { width: 23px; height: 23px; }

  /* Karten etwas grosszügiger */
  .karte { padding: 20px 22px; }
  .kopf h1 { font-size: var(--ebene2); }
}

/* ── Terminliste auf der Startseite ── */
.terminkarte { padding: 5px 16px; }
.terminzeile { padding: 6px 0; }
.terminzeile.mitlinie { border-top: 1px solid var(--linie); }
.terminhaken { flex-shrink: 0; margin-top: 3px; }
.terminhaken .box {
  width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--linie);
  display: inline-flex; align-items: center; justify-content: center;
}
.terminhaken .box.an { background: var(--terra); border-color: var(--terra); }
.terminknopf { flex: 1; text-align: left; }
.terminwas { display: block; font-size: var(--ebene5); line-height: 1.45; margin-top: 2px; }
.terminwann {
  display: block; font-size: var(--ebene7); color: var(--grau);
  letter-spacing: .05em; text-transform: uppercase;
}
.terminwann.bald { color: var(--terra); }
.terminwas.ab { color: var(--grau); text-decoration: line-through; }
.termintextblock { display: block; margin: 6px 0 2px; }
.termintext { display: block; font-size: var(--ebene6); color: var(--grau); line-height: 1.45; margin-bottom: 5px; }

.terminaufgaben { margin: 4px 0 0; }
.terminaufgaben .haken { align-items: flex-start; padding: 3px 0; gap: 9px; }
.terminaufgaben .termintext { margin-bottom: 0; }

.box.klein { width: 17px; height: 17px; border-radius: 5px; }

.terminstand {
  margin-left: 14px; font-size: var(--ebene7); font-weight: 400; color: var(--grau);
  background: var(--sand); border-radius: 99px; padding: 1px 7px;
}

.offenzeile { display: flex; gap: 16px; margin-top: 10px; padding-top: 8px;
              border-top: 1px solid var(--linie); }
.offenwann { color: var(--terra); font-size: var(--ebene6); }

/* ── Sprung zu einer anderen Stelle in der App ── */
.sprung {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: var(--sand); border: 1px solid var(--linie); border-radius: 10px;
  padding: 9px 12px; margin-top: 4px;
}
.sprungtext { flex: 1; font-size: var(--ebene5); color: var(--terra); }
.sprungpfeil { display: inline-flex; transform: rotate(-90deg); }

.registernr {
  font-size: var(--ebene7); color: var(--terra); letter-spacing: .06em;
  text-transform: uppercase; margin-bottom: 3px;
}

/* ── Notfall: Nummernknopf oben, Reiter darunter ── */
.notfallreiter { margin-bottom: 14px; }
.nummernknopf {
  display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
  background: var(--alarm-hell); border: 1px solid #EBC6C0; border-radius: 12px;
  padding: 11px; margin-bottom: 9px;
  font-size: var(--ebene4); color: var(--alarm);
}
.nummernknopf.an { background: var(--alarm); border-color: var(--alarm); color: #fff; }
.notfallreiter .reiter { margin-bottom: 0; }

.hinweiskarte { border-left: 3px solid var(--terra); }

/* ── Sofortmassnahmen: heller Alarmgrund, roter Rand ── */
.karte.dringend {
  background: var(--alarm-hell);
  border-color: #EBC6C0;
  border-left: 3px solid var(--alarm);
}
.karte.dringend .blocktitel { color: var(--alarm); }
.karte.dringend .faltpfeil svg { stroke: var(--alarm); }

/* Wochenende-Kasten auf der Startseite: enger gesetzt */
.wochenende .haken { padding: 4px 0; }
.wochenende .hakentext { line-height: 1.35; }
.wochenende .neuzeile { margin-top: 6px; padding-top: 8px; }


.faltkarte .zeile.mitte { flex: 1; }

.gesamtstand { font-size: var(--ebene6); color: var(--grau); }

/* ── Etappen als Knopf ── */
.etappeknopf { position: relative; width: 100%; text-align: left; background: none; border: 0; }
/* Pfeil nach unten = lässt sich aufklappen, nach oben = ist offen */
.etappepfeil {
  position: absolute; right: 0; top: 2px;
  display: inline-flex; transition: transform .15s;
}
.zurueckzeile {
  display: flex; align-items: center; gap: 6px; background: none; border: 0;
  font-size: var(--ebene6); color: var(--terra); padding: 0 0 6px;
}
.zurueckpfeil { display: inline-flex; transform: rotate(90deg); }
.landtitel {
  font-weight: 600; font-size: var(--ebene2); color: var(--tinte); margin-bottom: 10px; }

/* Länderfarben im Zeitstrahl */
.ortlabel.gt { color: #7A6A4F; letter-spacing: 0.1em; }
.ortlabel.cr { color: #4E6B52; letter-spacing: 0.1em; }

.flagge { border-radius: 2px; vertical-align: middle; }
.ortlabel.zeile { display: flex; align-items: center; gap: 6px; }
.ortlabel.pe { color: #A33; letter-spacing: 0.1em; }

/* Ländermarke im Zeitstrahl */
.landmarke {
  display: flex; align-items: center; gap: 10px;
  font-size: var(--ebene3); letter-spacing: -0.01em;
  margin: 21px 0 10px; padding: 0;
}
.landmarke:first-child { margin-top: 2px; }
.landmarke.gt { color: #7A6A4F; }
.landmarke.cr { color: #4E6B52; }
.landmarke.pe { color: #A33; }

.landknopf { background: none; border: 0; width: 100%; text-align: left; }
.landpfeil { display: inline-flex; transform: rotate(-90deg); opacity: .55; margin-left: 2px; }

/* Notruf 911: Nummer links, Text daneben, Telefon rechts */
.notrufzeile { align-items: center; gap: 14px; }
.notrufnr {
  font-weight: 700;
  font-size: var(--ebene1); line-height: 1;
  color: var(--alarm); flex-shrink: 0;
}

.chip.chipalarm { color: var(--alarm); border-color: #EBC6C0; }
.chip.chipalarm.an { background: var(--alarm); border-color: var(--alarm); color: #fff; }

/* Zusatzinformation: leicht gelb hinterlegt */
.karte.zusatz { background: #FBF3DC; border-color: #EBDFBC; }
.karte.zusatz .blocktitel { color: #7A6320; }
.karte.zusatz .faltpfeil svg { stroke: #9A7D28; }

/* Begriff mit Zusatztext */
.mitmehr { list-style: none; }
.mehrknopfzeile { display: flex; align-items: baseline; gap: 8px; text-align: left; }
.mehrmarke {
  display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  background: #FBF3DC; border: 1px solid #E8D9AE; border-radius: 11px;
  padding: 2px 9px 2px 4px; margin-left: 8px;
}
.mehrmarke.auf { background: #F3E7C6; }
.mehrzeichen {
  width: 15px; height: 15px; border-radius: 8px; flex-shrink: 0;
  background: #E0CE96; color: #6B551A; font-size: var(--ebene7); line-height: 15px;
  text-align: center; font-style: italic; font-weight: 600;
}
.mehrtext { font-size: var(--ebene7); color: #7A6320; white-space: nowrap; }
.mehrbox {
  display: none; background: #FBF3DC; border: 1px solid #EBDFBC; border-radius: 10px;
  padding: 10px 12px; margin: 8px 0 2px;
}
.mehrbox.offen { display: block; }
.mehrbox .text { font-size: var(--ebene6); line-height: 1.5; color: #5C4C1C; }

/* Einträge in einer Gruppe: kleiner und in Navy, damit der Titel führt */
.blockband .faltkopf .blocktitel {
  font-size: var(--ebene5); font-weight: 500; color: var(--ink);
}


/* Nach dem roten Sofortblock beginnt der ruhige Teil – deutlich mehr Luft */
.karte.faltkarte.dringend + .gruppentitel.klein3 { margin-top: 44px; }

/* Übersichtskarte auf Heute – gleiche Fläche wie die Gruppen */
.blockband .zeile.mitte { padding: 2px 0; }

/* Kopfzeile einer Hakenliste in der Klappzeile: kein Abstand nach unten */
.blockband .faltkopf .zeile.mitte { padding: 0; }
.blockband .faltkopf .blocktitel { margin-bottom: 0; }
.blockband > .faltkarte > .faltkopf { padding-top: 5px; padding-bottom: 5px; }

.stationkopf { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }



/* Aufgeklappte Station in der Zeitachse */
.stationsinhalt { margin: 2px 0 20px 2px; }
.etappeknopf.auf .etappenort { color: var(--terra); }
.etappepfeil.auf { transform: rotate(180deg); }

/* ── Ländermarke und Stationszeile: drei Ebenen ── */
.landmarke {
  display: flex; align-items: flex-start; gap: 10px;
  margin: 30px 0 12px; padding: 0; width: 100%; text-align: left;
}
.landmarke:first-child { margin-top: 4px; }
.landtext { flex: 1; }
.landzeile { display: flex; align-items: center; gap: 9px; }
.landname {
  font-weight: 600; font-size: var(--ebene3); line-height: 1.1; }
/* Ein Ton für alle Länder – die Flagge unterscheidet. */
.landname.gt, .landname.cr, .landname.pe, .landname.ch { color: #211C18; }
.landzeit { font-size: var(--ebene6); color: var(--grau); margin: 3px 0 2px; }
.landpfeil { display: inline-flex; transform: rotate(-90deg); margin-top: 6px; }

.etappenzeit { font-size: var(--ebene6); color: var(--grau); margin: 1px 0 3px; }

/* Inhalt eines Beutels – zweite Zeile in der Checkliste */
.unterzeile { display: block; font-size: var(--ebene6); color: var(--grau); line-height: 1.4; margin-top: 1px; }

/* Tourismusportal – schmale farbige Zeile in der Route */
.portalzeile {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: transparent; border: 0; border-radius: 0;
  padding: 2px 2px 10px; margin: 0 0 8px;
}
.portaltext { font-size: var(--ebene6); color: var(--grau); }

/* Buchen – der einzige Weg nach aussen, deshalb kräftig */
.karte.buchenkarte {
  position: relative;
  display: block;
  background: var(--terra); border-color: var(--terra);
}
.karte.buchenkarte .kacheltitel { color: #fff; }
.buchenunter { font-size: var(--ebene6); color: rgba(255,255,255,.85); line-height: 1.4; }
.buchenpfeil {
  position: absolute; right: 14px; top: 50%; margin-top: -8px;
  display: inline-flex; transform: rotate(-90deg); opacity: .9;
}

/* Zwischenüberschrift in einer Checkliste */
.hakengruppe {
  font-size: var(--ebene4); font-weight: 600; color: var(--ink);
  margin: 14px 0 4px; padding-top: 10px; border-top: 1px solid var(--linie);
}
.hakengruppe:first-child { margin-top: 0; padding-top: 0; border-top: 0; }

/* Legende in einer Checkliste */
.hakenlegende { font-size: var(--ebene6); color: var(--grau); margin: 2px 0 6px; }
/* Zone links, Inhalt rechts – ohne Linien */
/* Ort direkt hinter dem Artikel, in Grau */
/* Der Zusatz nach " ~ " steht auf einer eigenen Zeile. */
.hakenzone { display: block; color: #A39A8D; margin-left: 0; margin-top: 2px; }

/* Aufklappbare Zeilen: Pfeil deutlich, Fläche als Fläche erkennbar */
.blockband > .faltkarte + .faltkarte > .faltkopf { border-top: 1px solid var(--linie); }
.faltpfeil { opacity: 1; }


/* ═══ Dunkelmodus ═══
   Folgt der Einstellung des iPhones. Terracotta und Alarmrot bleiben
   gleich – Signalfarben dürfen nicht wandern. */
@media (prefers-color-scheme: dark) {
  :root {
    --sand: #1E1B18;
    --sand-tief: #16130F;
    --karte: #2B2521;
    --ink: #EFE7DA;
    --grau: #A89E93;
    --linie: #3D352E;
    --terra-hell: #3A2620;
    --alarm-hell: #3B211E;
  }
  .blockband { border-color: var(--linie); }
  .blockband > .faltkarte + .faltkarte > .faltkopf { border-top-color: var(--linie); }
  .hakengruppe { border-top-color: var(--linie); }
    --navy: #9FB4D8;
  .haken .box { border-color: #5A5047; }
  .meldeknopf { border-color: #4A342E; }
  .feld input, textarea { background: #171412; border-color: #4A423A; color: var(--ink); }
  input::placeholder, textarea::placeholder { color: #6E655C; }
  .hinweiskarte, .karte { background: var(--karte); }
  img, .flagge { filter: brightness(.9); }
}

/* ═══ Klickflächen ═══
   Alles, was angetippt wird, misst mindestens 44 Punkte – die Hand
   trifft im Bus und im Dunkeln nicht genau. */
.haken, .faltkopf, .etappe, .kachel, .block, .reiterknopf,
.textknopf, .rundknopf, .navknopf, .mehrknopfzeile {
  min-height: 44px;
}
.haken { padding: 11px 0; align-items: center; }
.haken .box { flex-shrink: 0; }
.textknopf { padding: 11px 8px; margin: -11px -8px; }
.reiterknopf { padding: 12px 14px; }

/* ═══ Braucht Internet ═══
   Ein kleines Zeichen hinter allem, was ohne Netz nicht geht. */
.netz {
  display: inline-flex; align-items: center; vertical-align: middle;
  margin-left: 5px; opacity: .55;
}
.netz svg { display: block; }

/* Hostelzeile: Name gross, Ort klein darunter */
.hostelort { display: block; font-size: var(--ebene6); color: var(--grau); margin-top: 2px; }
.faltkopf .ortlabel { display: block; margin-bottom: 3px; }

/* Gesamtliste der To-dos – vier Spalten, die durchgehend fluchten */
.todoliste {
  background: var(--karte); border: 1px solid var(--linie);
  border-radius: 14px; overflow: hidden; margin-top: 4px;
}
.todozeile {
  display: grid;
  grid-template-columns: 22px 30px 1fr 62px;
  align-items: center; column-gap: 10px;
  width: 100%; text-align: left;
  padding: 0 12px;
}
.todokopf {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 42px;
  padding: 10px 14px 10px 13px;
  background: transparent;
  border-bottom: 1px solid #F0EBE2;
  border-top: 1px solid #F0EBE2;
}
.todoliste > .todokopf:first-of-type { border-top: 0; }
.todokopf span {
  font-size: var(--ebene7); letter-spacing: .04em;
  text-transform: uppercase; color: var(--grau);
}
.todokopf .todogruppe {
  font-size: var(--ebene5); font-weight: 600;
  color: #211C18; letter-spacing: 0; text-transform: none;
}
.todokopf .todozahl {
  font-size: var(--ebene6); color: #A9A296;
  text-transform: none; letter-spacing: 0;
}
.todokopf + .todokopf { border-top: 1px solid var(--linie); }
.todozeile {
  min-height: 37px; padding-top: 6.5px; padding-bottom: 6.5px;
  border-bottom: 1px solid #F5F0E8;
}
.todozeile:last-child { border-bottom: 0; }
/* Alle Zeilen gleich – die Sortierung nach Thema genügt als Ordnung. */
.todozeile .box {
  width: 19px; height: 19px; flex-shrink: 0;
  border: 1.5px solid #CBBFAF; border-radius: 6px;
  background: var(--karte);
  display: inline-flex; align-items: center; justify-content: center;
}
.todozeile .box.an { background: var(--terra); border-color: var(--terra); }
.todotext {
  font-size: var(--ebene5); color: #211C18; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.todolead { font-size: var(--ebene7); color: #9C9284; white-space: nowrap; text-align: center; }
.tododatum {
  font-size: var(--ebene6); color: #A9A296;
  white-space: nowrap; text-align: right;
}
.todozeile.ab .todotext { color: var(--grau); text-decoration: line-through; }
.todozeile.ab .todolead, .todozeile.ab .tododatum { color: #A9A296; }

/* Verweis auf die vollständige To-do-Liste – gleiche Anmutung wie eine Zeile */
.allezeile {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; text-align: left; padding: 13px 14px; margin-top: 10px;
}
.pfeilrechts { transform: rotate(-90deg); }

/* Die Route sitzt in der Mitte und trägt einen Kreis – der Hauptweg der App */
/* Route ist das Herzstück – ein feiner Kreis, aktiv in Terracotta. */
/* Route ist das Herzstück – Kreis immer da, aktiv gefüllt. */
.tabkreis {
  width: 34px; height: 34px; border-radius: 17px; margin-top: -4px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid #E7CFC4; background: #FCF4F0;
}
.tabkreis.an { border-color: var(--terra); background: var(--terra); }
.tab.wichtig { gap: 2px; }

/* Abgearbeitete Gruppen: nur noch eine Zeile am Fuss der Liste */
.todokopf.fertigkopf { background: var(--karte); border-bottom: 0; border-top: 1px solid var(--linie); }
.todokopf.fertigkopf .todogruppe { color: var(--grau); }

/* Wochen- und Monatsgruppen klappen auf – nur die erste steht offen */
.todogruppeninhalt { display: none; }
.todogruppeninhalt.offen { display: block; }
.todokopf { gap: 8px; }
.todozahl { margin-left: auto; }

/* Bemerkung unter einer App – kleiner und grau */
.appnote { display: block; font-size: var(--ebene6); color: var(--grau); margin-top: 3px; line-height: 1.45; }

/* App-Tabelle: Zeichen links, Name, Zweck und Bemerkung rechts */
.appliste {
  background: var(--karte); border: 1px solid var(--linie);
  border-radius: 14px; overflow: hidden; margin-top: 4px; margin-bottom: 14px;
}
.appzeile {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px 10px 13px; border-bottom: 1px solid #F0EBE2;
}
.appzeile:last-child { border-bottom: 0; }
.appikon { flex-shrink: 0; margin-top: 2px; }
.appname { font-size: var(--ebene5); font-weight: 600; color: var(--ink); }
.appzweck { font-size: var(--ebene5); color: var(--ink); }
.appname::after { content: " · "; color: var(--grau); font-weight: 400; }

/* Spalte rechts: Haken wenn installiert, sonst Kreuz */
.appzeile { width: 100%; text-align: left; }
.appstand {
  flex-shrink: 0; margin-top: 1px; width: 18px;
  display: flex; align-items: center; justify-content: flex-end;
}
/* Noch nicht installiert: leerer Kreis, kein Kreuz */
.appleer {
  width: 16px; height: 16px; border-radius: 8px;
  border: 1.5px solid #D8CEBF; display: inline-block;
}
.appzeile.da .appname, .appzeile.da .appzweck { color: var(--grau); }

/* Als Frau unterwegs – eigene, ruhige Farbe */
.karte.faltkarte.frau {
  background: #FBEFF0; border: 1px solid #E9CDD1; border-radius: 12px;
  margin: 4px 0 14px;
}
.karte.faltkarte.frau .faltkopf { padding: 13px 14px; }
.karte.faltkarte.frau .faltinhalt { padding: 0 14px 14px; }
.karte.faltkarte.frau .blocktitel { color: #8E3A4A; }

/* Drei kleine Kacheln nebeneinander, mit Luft zum ersten Land */
.kopfreihe { display: flex; align-items: center; justify-content: space-between; }
.routenkacheln {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px;
  margin: 10px 0 0;
  /* Kleben direkt an der Kopfzeile – der Grund reicht bis über den oberen Rand,
     damit beim Scrollen nichts durchscheint. */

}
.routenkachel {
  display: flex; align-items: center; justify-content: center;
  gap: 5px; min-height: 34px; padding: 5px 8px;
  background: transparent; border: 1px solid #E6DCCB; border-radius: 10px;
  font-size: var(--ebene7); color: var(--grau); text-align: center; line-height: 1.2;
}
.routenkachel .ikon { flex-shrink: 0; }

/* Buchen: leichte Zeilen statt Kästen */
.buchenliste {
  background: var(--karte); border: 1px solid var(--linie);
  border-radius: 12px; overflow: hidden; margin: 4px 0 16px;
}
.buchenzeile {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; border-bottom: 1px solid #F0EBE2;
}
.buchenzeile .min0 { flex: 1; min-width: 0; }
.buchenzeile .faltpfeil { flex-shrink: 0; }
.linkzeile .min0 { flex: 1; min-width: 0; }
.buchenliste .buchenzeile:last-child { border-bottom: 0; }
.buchenname { display: block; font-size: var(--ebene5); color: var(--ink); }
.buchenzeile .hinweis { display: block; margin-top: 1px; }

/* Feinschliff Startseite */
/* 4 Notfall kompakter, weniger Fläche */
.notfallleiste {
  padding: 6px 6px 6px 13px; gap: 9px; border-radius: 20px;
  margin: 0 0 8px auto; width: max-content;
  background: #FCF1EF; border: 1px solid #F0DAD5;
}
.notfallleiste .rundknopf.alarm { width: 28px; height: 28px; }
.notfallwort { font-size: var(--ebene6); }

/* 5 Termine: ruhige Hierarchie, feine Linien */
.terminkarte { padding: 4px 16px; }
.terminwann { font-size: var(--ebene6); color: #A9A296; letter-spacing: 0; text-transform: none; }
.terminwas { font-size: var(--ebene5); color: #211C18; }
.terminzeile.mitlinie { border-top: 1px solid #F0EBE2; }
.terminzeile { padding: 11px 0; }

/* 6 Alle To-dos: gleiche Innenabstände wie die Terminkarte */
.allezeile { padding: 14px 16px; margin-top: 10px; }

/* 9 Gemeinsame Kante und gleicher Rhythmus */
.karte, .terminkarte, .allezeile { margin-left: 0; margin-right: 0; }
.gruppenzeile { margin: 10px 0 8px; }
.terminkarte { border-radius: 14px; }
.allezeile { border-radius: 14px; }
.held { margin-bottom: 0; }

/* Feinschliff: Statuszahlen zurücknehmen, Leiste ohne Kreis */
.terminstand {
  font-size: 10.5px; color: #A9A296; background: #F3EEE6;
  border-radius: 20px; padding: 1px 6px;
}
.tab.wichtig { gap: 3px; }

/* Trefferflächen nach Apple: mindestens 44 Punkte */
.heldlupe::after {
  content: ""; position: absolute; top: 5px; left: 5px; width: 34px; height: 34px;
  border: 1px solid #E3D8C6; border-radius: 17px;
}
.heldlupe .ikon { position: relative; z-index: 1; }
.terminknopf {
  min-height: 38px; display: flex; align-items: center; gap: 10px; width: 100%;
}
.terminknopf .terminwas { flex: 1; min-width: 0; }
.terminknopf .terminwann { margin-left: auto; flex-shrink: 0; }
.todokopf { min-height: 38px; }

/* Lead als Kürzel – S kursiv */
.todolead i { font-style: italic; }

/* Spaltenbeschriftung der To-do-Liste */
.todospalten {
  display: grid; grid-template-columns: 22px 30px 1fr 62px;
  align-items: center; column-gap: 10px;
  padding: 7px 14px 5px 13px;
  border-bottom: 0;
}
/* "WER" sitzt mittig über der Spalte mit S / M / MS */
.todospalten span:nth-child(2) { text-align: center; }
.todospalten span {
  font-size: 10px; color: #BFB6A8;
  letter-spacing: .05em; text-transform: uppercase;
}

/* Checklisten und Packen: Zähler zurückgenommen */
.blockband .zaehler, .faltkopf .zaehler { color: #A9A296; font-size: var(--ebene6); }

/* Geld-Übersicht: Zeichen links, Chevron rechts */
.geldzeile { display: flex; align-items: center; gap: 12px; width: 100%; }
.geldzeile .min0 { flex: 1; min-width: 0; }
.geldzeile .faltpfeil { flex-shrink: 0; margin-left: 4px; }
.geldzeile .hinweis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.geldikon { flex-shrink: 0; }
.geldzeile .kacheltitel { display: block; }
.geldzeile .hinweis { display: block; margin-top: 2px; }

/* Detailansicht ruhiger */
.kopf h1 { font-weight: 600; }
.karte.faltkarte.dringend .blocktitel { font-weight: 600; }

/* Sofortmassnahme in der Detailansicht: flacher */
.karte.faltkarte.dringend .faltkopf {
  padding: 8px 14px; gap: 9px; justify-content: flex-start;
}
.karte.faltkarte.dringend .faltkopf .blocktitel { flex: 1; }
.karte.faltkarte.dringend { margin: 2px 0 16px; }
.karte.faltkarte.dringend .blocktitel { color: #B65A3C; font-size: var(--ebene5); }

/* Zeichen vor der Sofortmassnahme */
.dringendikon { flex-shrink: 0; display: inline-flex; align-items: center; }

/* Externe Verweise – ruhige Zeile mit feiner Linie */
.linkzeile {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 2px; margin: 0;
  border-bottom: 1px solid #F5F0E8;
}
.linkzeile:last-child { border-bottom: 0; }
.linktitel { display: block; font-size: var(--ebene5); color: #211C18; }
.linkzeile .hinweis { display: block; margin-top: 1px; }

/* Länder klar über den Stationen */
.landmarke { padding-bottom: 2px; }
.landname { font-size: var(--ebene3); }
.landpfeil { opacity: .9; }

/* Land als Einstieg: Name kräftig, Chevron in Terracotta deutlich sichtbar */
.landmarke { cursor: pointer; }
.landname { font-weight: 600; }
.landpfeil { opacity: 1; }
.landmarke .landzeit, .landmarke .landtext .hinweis { color: var(--grau); }

/* 5 Geöffnete Station: mehr Kontrast zur geschlossenen */
.etappeknopf.auf { background: #F6EFE6; }
.stationsinhalt { border-left-width: 2.5px; }

/* Etwas Luft zwischen Kopflinie und erstem Inhalt (nicht auf der Route) */
#app > div > .todoliste:first-child,
#app > div > .gruppentitel:first-child,
#app > div > .block:first-child,
#app > div > .kopf:first-child { margin-top: 6px; }

/* Hinweis unter einem Listenpunkt – grau und kleiner, wie in der To-do-Liste */
.hakennote {
  display: block; margin-top: 2px;
  font-size: var(--ebene6); color: #9C9284; line-height: 1.4;
}

/* Unsichtbarer Ankerpunkt für die Sprungkacheln */
.sprungmarke { height: 0; }

/* Gewählter Bereich in der Kachelreihe */
.routenkachel.an {
  background: #FCF4F0; border-color: #E7CFC4; color: var(--terra);
}

/* Ablaufschritt: offen sichtbar, mit Zeitmarke – kein Aufklappen */
.schrittblock {
  position: relative; margin: 0; padding: 12px 0 10px;
  border-top: 1px solid #F0EBE2;
}
.schrittblock:first-of-type { border-top: 0; }
.schrittzeit {
  font-size: var(--ebene4); font-weight: 600; color: var(--terra);
  letter-spacing: -.01em; margin-bottom: 7px;
}
.schrittblock .punkte.offenblock { margin: 0 0 6px; padding-left: 16px; }
.schrittblock .punkte.offenblock li { margin-bottom: 7px; }

/* Zeitstatus im geöffneten Stopp */
.stopstatus {
  font-size: var(--ebene6); color: var(--grau);
  margin: 2px 0 12px;
}
.stopstatus.nah { color: var(--terra); font-weight: 600; }

/* Jetzt erledigen – kompakte Aktionszone */
.jetzttitel { margin-top: 0; margin-bottom: 6px; }
.jetztliste {
  background: var(--karte); border: 1px solid var(--linie);
  border-radius: 12px; overflow: hidden; margin-bottom: 16px;
}
.jetztzeile {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 10px 13px; border-bottom: 1px solid #F5F0E8;
}
.jetztzeile:last-child { border-bottom: 0; }
.jetztpunkt {
  width: 7px; height: 7px; border-radius: 4px; margin-top: 7px; flex-shrink: 0;
  border: 1.5px solid var(--terra);
}
.jetzttext { display: block; font-size: var(--ebene5); color: #211C18; }
.jetztlinks { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 5px; }
.aktionslink {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--ebene6); color: var(--terra); font-weight: 500;
  padding: 3px 0;
}

/* Der Abschnitt, der jetzt an der Reihe ist */
.schrittblock.jetzt {
  background: #FBF6EF; border-radius: 10px;
  margin: 0 -10px; padding-left: 10px; padding-right: 10px;
}

/* Verweise am Ende eines Ablaufschritts – leicht abgesetzt */
.linkblock {
  background: #F7F2EA; border-radius: 10px;
  padding: 2px 12px; margin: 10px 0 2px;
  border-top: 2px solid var(--karte);
}
.linkblock .linkzeile { border-bottom: 1px solid #EDE6DA; }
.linkblock .linkzeile:last-child { border-bottom: 0; }

/* Nachschlagethemen im Stopp: gleicher Fluss wie die Ablaufschritte */
.blockband.flach {
  background: transparent; border: 0; border-radius: 0;
  margin: 0 0 6px; padding: 0;
  border-top: 1px solid #F0EBE2;
}
.blockband.flach .faltkarte { border-radius: 0; margin: 0; background: transparent; }
.blockband.flach .faltkopf { padding: 12px 0; }
.blockband.flach .faltinhalt { padding: 0 0 10px; }
.blockband.flach > .faltkarte + .faltkarte { border-top: 1px solid #F5F0E8; }
.stopptitel { margin-top: 16px; }

/* Sprung mitten im Ablauf – schmaler als eine eigene Karte */
.schrittblock .sprung { margin: 2px 0 4px; padding: 8px 11px; }

/* Ablaufpunkt, der zu einer Liste führt – wie ein normaler Punkt, aber antippbar */
/* Sprungpunkt: identisch zu den anderen Punkten, nur mit Pfeil rechts */
.punktsprung { margin-bottom: 7px; }
.punktknopf {
  display: flex; align-items: flex-start; gap: 10px; width: 100%;
  text-align: left; padding: 0; background: none; border: 0;
  font: inherit; color: inherit;
}
.punktknopf .min0 { flex: 1; min-width: 0; }
.punktknopf .faltpfeil { flex-shrink: 0; margin-top: 1px; }

/* Abschnittstitel im Stopp – eine Stufe unter dem Stationstitel */
.gruppentitel.stopptitel { font-size: var(--ebene5); }

/* Rückweg nach einem Sprung aus der Route */
.zurueckpfad {
  display: flex; align-items: center; gap: 7px;
  padding: 10px 2px 12px; margin: 0;
  font-size: var(--ebene5); color: var(--terra); background: none; border: 0;
}

/* Sprungpfeil an einer Checklistenzeile */
.hakensprung {
  flex-shrink: 0; padding: 6px 2px 6px 8px;
  background: none; border: 0; display: flex; align-items: center;
}
.hakensprung .ikon { transform: rotate(-90deg); }

/* Warnung in einer Zeile – gelb hinterlegt wie die Zusatzkarten */
.warnung {
  background: #FBF3DC; color: #7A6320;
  padding: 1px 6px; border-radius: 5px;
  box-decoration-break: clone; -webkit-box-decoration-break: clone;
}

/* Drei Listenwege auf der Startseite – eine Karte, feine Linien */
.startlisten { margin-top: 0; padding: 0 16px; }
.listenzeile {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 40px; padding: 0; background: none; border: 0;
  border-bottom: 1px solid #F5F0E8; text-align: left;
}
.startlisten .listenzeile:last-child { border-bottom: 0; }
.listenzahl { margin-left: auto; font-size: var(--ebene6); color: #A9A296; }

/* Termine und Listen teilen sich eine Karte */
.karte.startkarte { padding: 4px 0; border-radius: 16px; }
.karte.startkarte .terminkarte { padding: 0 16px; }
.karte.startkarte .startlisten .listenzeile:first-child { border-top: 1px solid #F0EBE2; }

/* ══ Pura Vida Flow – freier Home-Bereich ══════════════════════ */
.flowbereich { margin-top: 14px; }

.flowtitel {
  font-size: var(--ebene4); font-weight: 600; color: #211C18;
  margin: 0 2px 10px;
}

/* Termine frei auf dem Sand, ohne Karte */
.flowtermin {
  display: flex; align-items: baseline; gap: 10px; width: 100%;
  min-height: 44px; padding: 4px 2px; background: none; border: 0;
  text-align: left;
}
.flowtermin.versetzt { padding-left: 22px; }
.flowaufgabe { flex: 1; min-width: 0; font-size: var(--ebene5); color: #211C18; }
.flowwann {
  flex-shrink: 0; font-size: var(--ebene6); color: var(--terra);
  display: inline-flex; align-items: baseline; gap: 7px;
}
.flowstand {
  font-size: 10.5px; color: #A9A296; background: #F3EEE6;
  border-radius: 20px; padding: 1px 6px;
}

/* Die Kurve und die drei Wege darum herum */
.flow { position: relative; height: 210px; margin: 14px 0 4px; }
.flowlinie { position: absolute; inset: 0; }
.flowlinie svg { width: 100%; height: 100%; display: block; }

.flowweg {
  position: absolute; display: flex; align-items: center; gap: 9px;
  min-height: 44px; padding: 6px 4px; background: none; border: 0;
  text-align: left;
}
.flowweg.obenlinks   { left: 2px;   top: 2px; }
.flowweg.untenmitte  { left: 4px;   top: 92px; }
.flowweg.obenrechts  { right: 6px;  top: 156px; }

.flowikon { flex-shrink: 0; }
.flowwegtitel { display: block; font-size: var(--ebene5); font-weight: 600; color: #211C18; }
.flowwegzahl { display: block; font-size: var(--ebene6); color: #A9A296; margin-top: 1px; }

/* Wochenende erscheint nur samstags und sonntags, unter der Kurve */
.flowweg.wochenzeile { position: static; margin-top: 4px; }

/* ══ Eine Welle: das Bild endet in einem organischen Bogen ═════ */
/* Darunter nur Ruhe – die Fläche geht ton in ton in den Sand über. */
.heldtext {
  margin: -66px calc(-1 * max(20px, env(safe-area-inset-left))) 0
          calc(-1 * max(20px, env(safe-area-inset-left)));   /* bis an beide Ränder */
  padding: 64px 38px 22px;
  box-shadow: none;
  position: relative;
  display: block;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFFDFA 34%, #FAF4EA 68%, var(--sand) 100%);
  -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 66" preserveAspectRatio="none"><path d="M0 46.5 C 80 43, 150 10, 240 10 C 320 10, 362 18.7, 400 27.4 L400 66 L0 66 Z" fill="%23000"/></svg>'), linear-gradient(#000, #000);
  -webkit-mask-size: 100% 66px, 100% calc(100% - 66px);
  -webkit-mask-position: left top, left 66px;
  -webkit-mask-repeat: no-repeat, no-repeat;
  mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 66" preserveAspectRatio="none"><path d="M0 46.5 C 80 43, 150 10, 240 10 C 320 10, 362 18.7, 400 27.4 L400 66 L0 66 Z" fill="%23000"/></svg>'), linear-gradient(#000, #000);
  mask-size: 100% 66px, 100% calc(100% - 66px);
  mask-position: left top, left 66px;
  mask-repeat: no-repeat, no-repeat;
}
/* Die Karte selbst ist unsichtbar – sichtbar sind Bild und Fläche. */
.held { background: none; border: 0; border-radius: 0; overflow: visible; contain: none; }
.held img { border-radius: 14px 14px 0 0; }
.heldtext .min0 { padding-right: 52px; }   /* Platz für die Lupe */
.heldlupe { position: absolute; right: 24px; top: 60px; margin-top: 0; }
/* Der Notfallknopf steht links unter der Länderzeile, nicht mehr allein rechts. */
.startkopf .notfallzeile { justify-content: flex-end; margin-top: 12px; }
.startkopf .notfallleiste { margin-bottom: 0; }

/* Termine und Wege ohne Rahmen, direkt auf dem Sand */
.offenfeld { background: none; border: 0; padding: 0; }
.offenfeld .terminkarte { padding: 0; }
.offenfeld .terminzeile { padding: 0; }
.offenfeld .terminzeile.mitlinie { border-top: 1px solid #EBE3D6; }
.offenfeld .listenzeile { padding: 0; border-bottom: 1px solid #EBE3D6; }
.offenfeld .listenzeile:last-child { border-bottom: 0; }
.listenikon { flex-shrink: 0; margin-right: 10px; display: inline-flex; }

.offenfeld.termine { margin-bottom: 6px; }
.offenfeld .terminknopf { padding: 4px 0; }



/* ══ Alles im Blick: drei Kacheln auf dem Sand ═════════════════ */
.blickreihe {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  margin: 2px 0 4px;
}
.blickkachel {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  min-height: 44px; padding: 14px 4px 16px;
  background: none; border: 0; text-align: center; position: relative;
}
/* Die Trennlinie ist kurz und hell – sie ordnet, ohne aufzufallen. */
.blickkachel::before {
  content: ""; position: absolute; left: 0; top: 24%; height: 52%;
  width: 1px; background: #EBE3D6;
}
.blickkachel:first-child::before { display: none; }
.blickwas { font-size: var(--ebene4); color: #211C18; }
.blickzahl { font-size: var(--ebene6); color: var(--grau); }

/* Aufgaben, die an einer anderen hängen: grau und gesperrt. */
.todozeile.wartet { opacity: .55; }
.todozeile.wartet .tododatum { color: var(--grau); font-size: var(--ebene7); }
.terminhinweis {
  font-size: var(--ebene5); color: #5A524C; line-height: 1.55; margin: 6px 0 0;
}

/* Abhängige Aufgaben stehen klein unter der Aufgabe, an der sie hängen. */
.danachzeile {
  font-size: var(--ebene7); color: #A9A296; line-height: 1.5;
  margin: 4px 0 2px; letter-spacing: .4px;
}
.danachpunkt {
  display: block; font-size: var(--ebene6); color: var(--grau);
  letter-spacing: 0; line-height: 1.6; margin-left: 10px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Listentitel sind die Einstiegspunkte – etwas mehr Gewicht als der Zähler. */
.blockband .faltkopf .blocktitel { font-size: 15px; }

</style>
</head>

const el = (tag, attrs = {}, ...kinder) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kinder.flat().forEach((c) => {
    if (c == null) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
};

const rein = (t) => String(t).replace(/<[^>]+>/g, "");
/* Steuerzeichen aus Blocktiteln: "## " Gruppe, "!! " Zusatzinformation. */
const ohneSprung = (t) => String(t).split(" >> ")[0];

const alsUnterzeile = (text) => {
  /* "Punkt<i>Hinweis</i>" wird zu zwei Zeilen: Punkt normal, Hinweis grau. */
  const m = String(text).match(/^(.*?)<i>(.*?)<\/i>$/);
  return m ? m[1] + '<span class="hakennote">' + m[2] + "</span>" : text;
};

const ohneMarker = (t) => String(t).replace(/^(##|!!|\*\*) /, "");

/* Zerlegt "<b>Titel:</b> Erklärung" in zwei Zeilen – alle Listen gleich aufgebaut. */
const zerlege = (p) => {
  if (typeof p !== "string") return p;
  const m = p.match(/^<b>([^<]{2,40}?)[:.]?<\/b>[\s:–—-]*(.+)$/);
  if (!m) return p;
  return { begriff: m[1].replace(/[:–—-]\s*$/, ""), text: m[2].trim() };
};
const flach = (t) => String(t).toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/ß/g, "ss");

/* Blöcke mit Sofortmassnahmen bekommen einen roten Rand und hellen Grund. */
const DRINGEND = ["sperren", "gestohlen", "verloren", "Notfall", "Denuncia", "Diebstahl"];
const NICHT_DRINGEND = ["kein Sperren", "was kein"];
const istDringend = (titel) => {
  const t = titel.toLowerCase();
  if (NICHT_DRINGEND.some((w) => t.includes(w.toLowerCase()))) return false;
  return DRINGEND.some((w) => t.includes(w.toLowerCase()));
};

/* Zeichnet die Blöcke eines Themas – "## Titel" wird zur Zwischenüberschrift. */
/* Kurze Themen zeigen alles offen – Aufklappen lohnt sich erst ab zwölf Punkten. */
const KURZ_OFFEN = 30;

const bloeckeMit = (bloecke) => {
  const gesamt = bloecke.reduce((n, b) => n + ((b[1] && b[1].length) || 0), 0);
  const alleOffen = gesamt <= KURZ_OFFEN;
  const teile = [];
  let band = null;

  const neuesBand = (titel) => {
    /* Überschrift über der Fläche – wie die Wochenroutine auf der Startseite. */
    if (titel) teile.push(el("div", { class: "gruppentitel abstandoben klein3" }, titel));
    band = el("div", { class: "blockband" });
    teile.push(band);
  };

  bloecke.forEach(([t, p]) => {
    if (t.startsWith("## ")) { neuesBand(t.slice(3)); return; }
    const block = faltblock(t, p, alleOffen);
    /* Rot und Gelb stehen für sich, alles andere sammelt sich in seiner weissen Fläche. */
    if (t.startsWith("** ")) { teile.push(block); band = null; return; }
    if (t.startsWith("!! ") || istDringend(t)) { teile.push(block); band = null; return; }
    if (!band) neuesBand(null);
    band.appendChild(block);
  });
  return teile;
};

const faltblock = (titel, punkte, offenStart = false) => {
  const inhalt = el("ul", { class: "punkte" },
    punkte.map((roh) => {
      const p = zerlege(roh);
      if (typeof p === "string") return el("li", { html: p });
      if (p.begriff) return begriffZeile(p);
      if (p.sprung) return el("li", { class: "ohnepunkt" }, sprungZeile(p));
      return el("li", { class: "ohnepunkt" }, p.url ? linkZeile(p) : anrufZeile(p));
    }));
  const koerper = el("div", { class: "faltinhalt" + (offenStart ? " offen" : "") }, inhalt);
  const pfeil = el("span", { class: "faltpfeil" + (offenStart ? " auf" : "") },
    svg("chevron", 18, "#B65A3C", 2.2));
  const zusatz = titel.startsWith("!! ");
  const reinTitel = ohneMarker(titel);
  const knopf = el("button", { class: "faltkopf", onclick: () => {
    const auf = koerper.classList.toggle("offen");
    pfeil.classList.toggle("auf", auf);
  } },
    istDringend(reinTitel)

const hakenliste = (titel, punkte, schluessel, ruecksetzbar = false, wichtig = 0) => {
  const stand = hole("haken:" + schluessel, {});
  let eigene = hole("eigene:" + schluessel, []);
  let pruefeKnopfRef = null;

  const inhalt = el("div");
  const zaehler = el("div", { class: "klein" });

  /* Die Abschnitte einer Station – erscheinen direkt unter ihrer Zeile. */
  const stationsinhalt = (S) => {

    const LISTEN = {

      "ankunft": ["Angekommen", ANKUNFT],
      "ortswechsel": ["Weiterreise", ORTSWECHSEL],
      "pack:inland": ["Packordnung Inland", PACK_INLAND],
      "pack:rucksack": ["Reiserucksack", PACK_RUCKSACK],
      "pack:hand": ["Handgepäck", PACK_HAND],
      "pack:body": ["Bodybag", PACK_BODY],
      "woche": ["Jede Woche", WOCHE],
      "tour:rucksack": ["Tagesrucksack", TAGESRUCKSACK],
      "tour": ["Tagsüber weg", TOUR],
      "rueckkehr": ["Rückkehr", RUECKKEHR],
    };

    /* Zeitstatus und die Aufgaben, die jetzt anstehen. */
    if (S.datum && S.jetzt) {
      const heute = new Date(); heute.setHours(0, 0, 0, 0);
      const ziel = new Date(S.datum + "T00:00:00");
      const tage = Math.round((ziel - heute) / 86400000);

      const status = tage < 0 ? "Erledigt"
        : tage === 0 ? "Heute"
        : tage === 1 ? "Morgen"
        : tage === 2 ? "Übermorgen"
        : "Noch " + tage + " Tage";

      /* Welche Phase gilt jetzt? */
      const phase = tage < 0 ? "nach" : tage === 0 ? "tag" : tage === 1 ? "vortag" : "vor";
      const dran = S.jetzt.filter(([wann, ab]) =>
        wann === phase && (wann !== "vor" || tage <= (ab || 99))).slice(0, 4);

      if (tage <= 7) {
        box.appendChild(el("div", { class: "stopstatus" + (tage <= 1 ? " nah" : "") }, status));
      }

      if (dran.length) {
        box.appendChild(el("div", { class: "gruppentitel klein3 jetzttitel" }, "Jetzt erledigen"));

                : null)));

        box.appendChild(kasten);
      }
    }

    S.abschnitte.forEach(([titel, eintraege]) => {
      /* Ein Titel mit ">> " ist ein Ablaufschritt: offen, ohne Aufklappen. */
      const ablauf = String(titel).startsWith(">> ");
      const reinT = ablauf ? titel.slice(3) : titel;

      if (ablauf) {
        /* Der Abschnitt, der jetzt gilt, wird ganz leicht hervorgehoben. */
        const phasenwort = { vor: "2 Tage", vortag: "1 Tag",
                             tag: "Am Flugtag", nach: "Nach der Landung" };
        const jetztPhase = S.datum ? (() => {
          const h = new Date(); h.setHours(0, 0, 0, 0);
          const t = Math.round((new Date(S.datum + "T00:00:00") - h) / 86400000);
          /* Erst ab zwei Tagen vorher gilt ein Abschnitt als aktuell. */
          if (t < 0) return "nach";
          if (t === 0) return "tag";
          if (t === 1) return "vortag";
          if (t === 2) return "vor";
          return null;
        })() : null;
        const istJetzt = jetztPhase && reinT.startsWith(phasenwort[jetztPhase]);

        box.appendChild(el("div", { class: "schrittblock" + (istJetzt ? " jetzt" : "") },

              el("ul", { class: "punkte offenblock" },

              el("button", { class: "faltkopf", onclick: () => {

                  (alle.length - 2) + " weitere Häuser"),
                pf),
              rest));
          }
          return;
        }
        holeBlock(e).forEach((b) => {
          if (String(b[0]).startsWith("## ")) return;
          band.appendChild(faltblock(ohneMarker(b[0]), b[1], alleOffen));
        });
      });
      box.appendChild(band);
    });
    return box;
  };

  const zeichne = () => {
    inhalt.innerHTML = "";
    const alle = punkte.concat(eigene);
    const zaehlbar = alle.filter((p) => !String(p).startsWith("## ")
      && !String(p).startsWith("%%"));
    /* Was offen ist, interessiert – nicht was schon abgehakt wurde. */
    const nochOffen = zaehlbar.filter((p) => !stand[p]).length;
    zaehler.textContent = nochOffen === 0 ? "fertig"
      : nochOffen === zaehlbar.length ? zaehlbar.length + " Punkte"

    alle.forEach((p, i) => {
      /* "## Titel" wird zur Zwischenüberschrift, "%%Text" zur Legende – beide ohne Kästchen. */
      if (String(p).startsWith("## ")) {
        inhalt.appendChild(el("div", { class: "hakengruppe" }, p.slice(3)));
        return;

      if (String(p).startsWith("%%")) {

      const selbst = i >= punkte.length;
      const zeile = el("div", {
        class: "hakenzeile" + (i === wichtig && wichtig > 0 ? " trennlinie" : ""),
      },
        el("button", {
          class: "haken" + (stand[p] ? " ab" : ""),
          onclick: () => {
            stand[p] = !stand[p];

          el("span", { class: "box" + (stand[p] ? " an" : "") },

                html: alsUnterzeile(ohneSprung(p)) })));

      /* "Text >> heute|packen" hängt einen Sprungpfeil an die Zeile. */
      const sprungTeil = String(p).split(" >> ")[1];
      if (sprungTeil) {

        zeile.appendChild(el("button", { class: "hakensprung",

          class: "weg", "aria-label": "Punkt entfernen",

            zeichne();
            if (pruefeKnopfRef) pruefeKnopfRef();

      }
      inhalt.appendChild(zeile);

    const feld = el("input", {
      class: "neufeld", placeholder: "Eigenen Punkt hinzufügen …",
      onkeydown: (e) => { if (e.key === "Enter") hinzu(); },
    });
    const hinzu = () => {
      const t = (feld.value || "").trim();
      if (!t || punkte.includes(t) || eigene.includes(t)) { feld.value = ""; return; }
      eigene = eigene.concat([t]);
      merke("eigene:" + schluessel, eigene);
      zeichne();
      const neuFeld = inhalt.querySelector(".neufeld");
      if (neuFeld) neuFeld.focus();

    inhalt.appendChild(el("div", { class: "neuzeile" },
      el("span", { class: "plus" }, "+"), feld,

  zeichne();

  const zuruecksetzen = el("button", { class: "ruecksetzen", onclick: () => {
    if (!confirm("Alle Haken dieser Liste entfernen?")) return;
    punkte.concat(eigene).forEach((p) => delete stand[p]);
    merke("haken:" + schluessel, stand);
    zeichne();
    pruefeKnopf();
  } }, "Alle Haken entfernen");

  const pruefeKnopf = () => {
    const fertig = punkte.concat(eigene).filter((p) => stand[p]).length;
    zuruecksetzen.style.display = (ruecksetzbar && fertig > 0) ? "block" : "none";
  };
  pruefeKnopfRef = pruefeKnopf;
  pruefeKnopf();

  /* Liste als Text kopieren – zum Weiterverwenden ausserhalb der App. */
  const alsText = () => {
    const zeilen = [titel, ""];
    punkte.concat(eigene).forEach((p) => {
      const t = String(p);
      if (t.startsWith("%%")) return;
      if (t.startsWith("## ")) { zeilen.push("", rein(t.slice(3)) + ":"); return; }
      const text = rein(alsUnterzeile(ohneSprung(t)).replace(/<br>/g, " – ")
        .replace(/<[^>]+>/g, ""));
      zeilen.push((stand[p] ? "[x] " : "[ ] ") + text.trim());
    });
    return zeilen.join("\n");
  };

  const kopieren = el("button", { class: "textknopf kopierknopf", onclick: () => {
    const text = alsText();
    const fertig = () => { kopieren.textContent = "kopiert"; 
      setTimeout(() => { kopieren.textContent = "Liste kopieren"; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(fertig, () => altKopie(text, fertig));
    } else altKopie(text, fertig);

  return karte([
    el("div", { class: "zeile mitte" }, el("div", { class: "blocktitel" }, titel), zaehler),
    inhalt,
    el("div", { class: "listenfuss" }, kopieren, zuruecksetzen),
  ]);
};

/* Ohne Zwischenablage-Rechte: Text markieren und kopieren lassen. */
const altKopie = (text, fertig) => {
  const feld = document.createElement("textarea");
  feld.value = text;
  feld.style.position = "fixed"; feld.style.opacity = "0";
  document.body.appendChild(feld);
  feld.select();
  try { document.execCommand("copy"); fertig(); } catch (e) { alert(text); }
  document.body.removeChild(feld);
};

/* ── Sicherung ─────────────────────────────────────────────────────
   iOS löscht den Speicher einer Web-App, wenn sie sieben Tage nicht
   geöffnet wird. Deshalb ein Text zum Kopieren und Zurückspielen. */

const sicherungLesen = () => {
  const daten = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf("sophie:") === 0) daten[k] = localStorage.getItem(k);
  }
  return btoa(unescape(encodeURIComponent(JSON.stringify(daten))));
};

const sicherungSchreiben = (text) => {
  const daten = JSON.parse(decodeURIComponent(escape(atob(text.trim()))));
  let n = 0;
  Object.keys(daten).forEach((k) => {
    if (k.indexOf("sophie:") === 0) { localStorage.setItem(k, daten[k]); n++; }
  });
  return n;
};

const sicherungBlock = () => {
  const box = el("div");
  const meldung = el("div", { class: "hinweis abstandoben" });

  const knopf = (text, klick) =>
    el("button", { class: "textknopf", onclick: klick }, text);

  box.appendChild(el("div", { class: "gruppentitel klein3 abstandoben" }, "Sicherung"));
  box.appendChild(karte([
    el("div", { class: "text" },
      "Haken, Nummern und Notizen liegen nur auf diesem Gerät. Schick dir den Text "
      + "ab und zu selbst – nach einer längeren Pause löscht das iPhone die Daten."),
    el("div", { class: "zeile abstandoben" },
      knopf("Sicherung kopieren", () => {
        const text = sicherungLesen();
        const fertig = () => { meldung.textContent = "Kopiert – jetzt irgendwohin einfügen."; };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(fertig, () => {
          window.prompt("Diesen Text kopieren:", text);
        });
        else window.prompt("Diesen Text kopieren:", text);
      }),
      knopf("Sicherung einlesen", () => {
        const text = window.prompt("Gesicherten Text einfügen:");
        if (!text) return;
        try {
          const n = sicherungSchreiben(text);
          meldung.textContent = n + " Einträge zurückgespielt.";
          setTimeout(() => location.reload(), 800);
        } catch (e) {
          meldung.textContent = "Der Text passt nicht. Nochmals ganz kopieren.";
        }
      })),
    meldung,
  ]));
  return box;
};

const hervor = (text, begriff) => {
  const i = flach(text).indexOf(flach(begriff));
  if (i < 0) return document.createTextNode(text);
  const von = Math.max(0, i - 40);
  const bis = Math.min(text.length, i + begriff.length + 70);
  const teil = (von > 0 ? "… " : "") + text.slice(von, bis) + (bis < text.length ? " …" : "");
  const j = flach(teil).indexOf(flach(begriff));
  const s = el("span");
  s.appendChild(document.createTextNode(teil.slice(0, j)));
  s.appendChild(el("mark", {}, teil.slice(j, j + begriff.length)));
  s.appendChild(document.createTextNode(teil.slice(j + begriff.length)));
  return s;
};

const seiteSuche = () => {
  const wrap = el("div");
  const ergebnis = el("div");
  const eingabe = el("input", {
    class: "suchfeld", placeholder: "Notpass, Automat, Impfung, Sámara …",
    oninput: (e) => zeichne(e.target.value.trim()),
  });

  const zeichne = (begriff) => {
    ergebnis.innerHTML = "";
    if (begriff.length < 2) {
      ergebnis.appendChild(karte(el("div", { class: "text" },
        "Durchsucht alles: Notfallnummern, Dokumente, Länderinfos, Hostels, Packliste, "
        + "Checklisten und die Route. Tippe auf einen Treffer, um an die Stelle zu springen.")));
      return;
    }
    const gesucht = flach(begriff);
    const erweitert = Object.entries(SYNONYME)
      .filter(([k]) => flach(k).includes(gesucht) || gesucht.includes(flach(k)))
      .map(([, v]) => flach(v).split(" ")).flat();

    const wort = (heu, nadel) =>
      new RegExp("(^|[^a-z0-9])" + nadel.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(heu);

    /* Handeln geht vor Nachschlagen: Notfall zuoberst, Packliste zuunterst. */
    const BEREICHSGEWICHT = { notfall: 4, geld: 3, wissen: 2, route: 2, buchen: 1, heute: 0 };

    /* Mehrere Wörter müssen alle vorkommen – sonst findet "Handy gestohlen"
       auch alles, was nur "gestohlen" enthält. */
    const woerter = gesucht.split(/\s+/).filter((w) => w.length > 1);

    const bewerte = (e) => {
      const alles = flach(`${e.titel} ${e.text} ${e.ort}`);
      const imTitel = flach(e.titel);
      let treffer = 0;

      if (woerter.length > 1) {
        const alleDa = woerter.every((w) => alles.includes(w));
        if (!alleDa) return 0;
        if (imTitel.includes(gesucht)) treffer = 5;
        else if (alles.includes(gesucht)) treffer = 4;
        else if (woerter.every((w) => imTitel.includes(w))) treffer = 3;
        else treffer = 2;
      } else {
        if (imTitel.includes(gesucht)) treffer = 3;
        else if (alles.includes(gesucht)) treffer = 2;
        else if (erweitert.some((w) => w.length > 3 && wort(alles, w))) treffer = 1;
      }
      if (!treffer) return 0;

      /* Wer nach "Handy" sucht, will zuerst das Handy-Register sehen –
         nicht einen Notfallpunkt, in dem das Wort nebenbei vorkommt.
         Massgebend ist der Registername, also der Teil vor dem ersten Punkt. */
      const register = flach(String(e.ort).split("·")[0]);
      const imRegister = woerter.every((w) => register.includes(w)) ? 10 : 0;

      return treffer * 4 + imRegister + (BEREICHSGEWICHT[e.ziel.seite] ?? 0);
    };

    let bewertet = INDEX.map((e) => ({ e, p: bewerte(e) })).filter((x) => x.p > 0);

    /* Finden alle Wörter zusammen fast nichts, zählt jedes Wort für sich. */
    if (bewertet.length < 3 && woerter.length > 1) {
      bewertet = INDEX.map((e) => {
        const alles = flach(`${e.titel} ${e.text} ${e.ort}`);
        const dabei = woerter.filter((w) => alles.includes(w)).length;
        if (!dabei) return null;
        const register = flach(String(e.ort).split("·")[0]);
        const imRegister = woerter.some((w) => register.includes(w)) ? 6 : 0;
        const imTitel = woerter.filter((w) => flach(e.titel).includes(w)).length;
        return { e, p: dabei * 4 + imTitel * 3 + imRegister
                     + (BEREICHSGEWICHT[e.ziel.seite] ?? 0) };
      }).filter(Boolean);
    }

    const treffer = bewertet
      .sort((a, b) => b.p - a.p)
      .slice(0, 30)
      .map((x) => x.e);

    if (!treffer.length) {
      ergebnis.appendChild(karte(el("div", { class: "text" },
        "Nichts gefunden. Versuch ein anderes Wort – die Suche findet nur, was wörtlich "
        + "dasteht.")));
      return;
    }
    ergebnis.appendChild(el("div", { class: "klein abstandunten" },
      treffer.length + " Treffer" + (treffer.length === 40 ? " (weitere vorhanden)" : "")));
    treffer.forEach((t) => {
      ergebnis.appendChild(el("button", {
        class: "block", onclick: () => gehe(t.ziel.seite, t.ziel.param),
      }, karte([
        el("div", { class: "ortlabel" }, t.ort),
        el("div", { class: "treffertitel" }, hervor(t.titel, begriff)),
        t.text ? el("div", { class: "hinweis" }, hervor(t.text, begriff)) : null,
      ])));
    });
  };

  wrap.appendChild(kopf("Suchen", null, () => gehe(vorSuche)));
  wrap.appendChild(el("div", { class: "suchzeile" },
    svg("search", 16, "#B65A3C", 1.9), eingabe));
  wrap.appendChild(ergebnis);
  zeichne("");
  setTimeout(() => eingabe.focus(), 60);
  return wrap;
};
