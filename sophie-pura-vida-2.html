/* Wandelt ein Datum wie "5. Sep" in "morgen" oder "in 4 Tagen" um. */
const MONATE = { jan: 0, feb: 1, mrz: 2, apr: 3, mai: 4, jun: 5, jul: 6, aug: 7,
                 sep: 8, okt: 9, nov: 10, dez: 11 };

const alsTage = (datum) => {
  /* "bis 26. Sep" und "ab 4. Sep" zählen wie das reine Datum. */
  const m = String(datum).match(/(\d{1,2})\.\s*([A-Za-zäöü]{3})/);
  if (!m) return null;
  const monat = MONATE[m[2].toLowerCase().slice(0, 3)];
  if (monat === undefined) return null;
  const heute = new Date();
  heute.setHours(0, 0, 0, 0);
  let jahr = heute.getFullYear();
  let ziel = new Date(jahr, monat, Number(m[1]));
  if (ziel < heute) ziel = new Date(jahr + 1, monat, Number(m[1]));
  return Math.round((ziel - heute) / 86400000);
};

const wannText = (datum) => {
  const t = alsTage(datum);
  if (t === null) return datum;
  if (t < 0) return "überfällig";
  if (t === 0) return "heute";
  if (t === 1) return "morgen";
  if (t <= 14) return "in " + t + " Tagen";
  return datum;
};

const todoTabelle = () => {
  /* Eine Zeile je Aufgabe: Haken, Tätigkeit, Lead, Datum.
     Gruppiert nach diese Woche, nächste Woche, später – sonst sind es zu viele. */
  const stand = hole("haken:alle", {});
  const box = el("div", { class: "todoliste" });
  /* Spaltenbeschriftung über der ersten Gruppe. */
  box.appendChild(el("div", { class: "todospalten" },
    el("span", {}, ""),
    el("span", {}, "Wer"),
    el("span", {}, "To-do"),
    el("span", { class: "tododatum" }, "Datum")));

  const MONATE = { Sep: 8, Okt: 9, Nov: 10, Dez: 11, Jan: 0, Feb: 1, Aug: 7 };
  const heute = new Date();
  heute.setHours(0, 0, 0, 0);
  /* Montag dieser Woche */
  const montag = new Date(heute);
  montag.setDate(heute.getDate() - ((heute.getDay() + 6) % 7));
  const naechsteWoche = new Date(montag); naechsteWoche.setDate(montag.getDate() + 7);
  const uebernaechste = new Date(montag); uebernaechste.setDate(montag.getDate() + 14);

  const wann = (text) => {
    const m = text.match(/(\d{1,2})\.\s*([A-Za-zä]{3})/);
    if (!m) return 2;                       // ohne Datum: später
    const jahr = heute.getFullYear() + (MONATE[m[2]] < heute.getMonth() ? 1 : 0);
    const d = new Date(jahr, MONATE[m[2]], parseInt(m[1], 10));
    if (d < naechsteWoche) return 0;
    if (d < uebernaechste) return 1;
    return 2;
  };

  /* Nach Datum sortieren – Einträge ohne Datum ans Ende. */
  const tag = (text) => {
    const m = text.match(/(\d{1,2})\.\s*([A-Za-zä]{3})/);
    if (!m) return 9e9;   // "vor Weiterflug" und Ähnliches ans Ende
    const jahr = heute.getFullYear() + (MONATE[m[2]] < heute.getMonth() ? 1 : 0);
    return new Date(jahr, MONATE[m[2]], parseInt(m[1], 10)).getTime();
  };
  /* Am selben Tag stehen verwandte Aufgaben beieinander. */
  const THEMEN = [
    [/Vacanza|Deckung|Versicher/, 0],                                               // Versicherung
    [/Flug|Bus |Tour|Transfer|Marco|Nacht|Sprachschule|Reiseerklärung|Adresse/, 1],  // Reise
    [/Revolut|Währung|Karten/, 2],                                                  // Geld
    [/iPhone|eSIM|IMEI|Wo ist|Kontrollzentrum|Geräte|Apps|Yallo/, 3],               // Handy
    [/iCloud|Scans|Ordner|Dossier|Notfallblatt|EDA|Karten laden/, 4],               // Ablage
  ];
  const thema = (was) => {
    for (const [muster, nr] of THEMEN) if (muster.test(was)) return nr;
    return 5;
  };
  const sortiert = TODO_ALLE.slice().sort((a, b) =>
    tag(a[1]) - tag(b[1]) || thema(a[0]) - thema(b[0]));

  /* Je Woche eine Gruppe – so bleiben auch die späteren Aufgaben übersichtlich. */
  const MONATSNAME = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun",
                      "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
  const WOCHE = 7 * 24 * 3600 * 1000;

  /* Wochentag davor – "Sa 5. Sep" liest sich schneller als "5. Sep". */
  const TAGE = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  /* S für Sophie, MA für Markus, alle für beide – S kursiv. */
  const KURZ = { Sophie: "S", Markus: "M", beide: "MS" };
  const leadZeichen = (lead) => {
    const k = KURZ[lead] || lead;
    return k === "S" ? el("i", {}, k) : el("span", {}, k);
  };

  const mitTag = (text) => {
    const t = tag(text);
    if (t === 9e9) return text;
    const d = new Date(t);
    const kurz = d.getDate() + "." + (d.getMonth() + 1) + ".";
    const vorsatz = /^bis/i.test(text) ? "bis " : "";
    return vorsatz + TAGE[d.getDay()] + " " + kurz;
  };

  const gruppen = [];
  const finde = (titel) => {
    let g = gruppen.find((x) => x[0] === titel);
    if (!g) { g = [titel, []]; gruppen.push(g); }
    return g;
  };

  const ohneDatum = [];
  sortiert.forEach((eintrag) => {
    const t = tag(eintrag[1]);
    if (t === 9e9) { ohneDatum.push(eintrag); return; }
    const nr = Math.floor((t - montag.getTime()) / WOCHE);
    const VOLL = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli",
                  "August", "September", "Oktober", "November", "Dezember"];
    let titel;
    if (nr <= 0) titel = "Diese Woche";
    else if (nr <= 4) {
      const start = new Date(montag.getTime() + nr * WOCHE);
      titel = "Woche ab " + start.getDate() + ". " + MONATSNAME[start.getMonth()];
    } else {
      /* Weiter weg genügt der Monat – sonst zerfällt die Liste in viele Wochen. */
      const d = new Date(t);
      titel = VOLL[d.getMonth()];
    }
    finde(titel)[1].push(eintrag);
  });
  if (ohneDatum.length) gruppen.push(["Unterwegs", ohneDatum]);

  /* Fertige Gruppen verschwinden – die Liste wird kürzer, während man arbeitet.
     Zuunterst steht, wie viele Gruppen schon erledigt sind. */
  const fertigeGruppen = gruppen.filter(([, e]) => e.every(([w]) => stand[w]));
  const offeneGruppen = gruppen.filter(([, e]) => !e.every(([w]) => stand[w]));

  offeneGruppen.forEach(([titel, eintraege], i) => {
    if (!eintraege.length) return;
    const offen = eintraege.filter(([w]) => !stand[w]).length;

    /* Nur die erste Gruppe steht offen – der Rest klappt auf Wunsch auf. */
    const zeilen = el("div", { class: "todogruppeninhalt" + (i === 0 ? " offen" : "") });
    const pfeil = el("span", { class: "faltpfeil" + (i === 0 ? " auf" : "") },
      svg("chevron", 16, "#B65A3C", 2.2));
    box.appendChild(el("button", { class: "todokopf", onclick: () => {
      const auf = zeilen.classList.toggle("offen");
      pfeil.classList.toggle("auf", auf);
    } },
      el("span", { class: "todogruppe" }, titel),
      el("span", { class: "todozahl" }, offen ? offen + " offen" : "fertig"),
      pfeil));
    box.appendChild(zeilen);
    eintraege.forEach((eintrag) => {
      const [was, datum, lead] = eintrag;
      const ab = stand[was];
      /* Hängt die Aufgabe an einer anderen, bleibt sie grau und gesperrt. */
      const wartet = ab ? null : gesperrtDurch(eintrag, stand);
      const zeilenAttr = {
        class: "todozeile" + (ab ? " ab" : "") + (wartet ? " wartet" : ""),
        onclick: () => {
          if (wartet) return;
          stand[was] = !stand[was]; merke("haken:alle", stand); zeichnen();
        },
      };
      if (wartet) zeilenAttr.disabled = "disabled";
      zeilen.appendChild(el("button", zeilenAttr,
        el("span", { class: "box klein" + (ab ? " an" : "") },
          ab ? svg("check", 11, "#fff", 3) : null),
        el("span", { class: "todolead" }, leadZeichen(lead)),
        el("span", { class: "todotext", html: was }),
        el("span", { class: "tododatum" }, wartet ? "wartet" : mitTag(datum))));
    });
  });

  /* Erledigte Gruppen: eine Zeile am Fuss, die sich öffnen lässt. */
  if (fertigeGruppen.length) {
    const anzahl = fertigeGruppen.reduce((n, [, e]) => n + e.length, 0);
    const fertigZeilen = el("div", { class: "todogruppeninhalt" });
    fertigeGruppen.forEach(([, eintraege]) => {
      eintraege.forEach(([was, datum, lead]) => {
        fertigZeilen.appendChild(el("button", {
          class: "todozeile ab",
          onclick: () => { delete stand[was]; merke("haken:alle", stand); zeichnen(); },
        },
          el("span", { class: "box klein an" }, svg("check", 11, "#fff", 3)),
          el("span", { class: "todolead" }, leadZeichen(lead)),
          el("span", { class: "todotext", html: was }),
          el("span", { class: "tododatum" }, mitTag(datum))));
      });
    });
    const pf = el("span", { class: "faltpfeil" }, svg("chevron", 16, "#8B8175", 2.2));
    box.appendChild(el("button", { class: "todokopf fertigkopf", onclick: () => {
      const auf = fertigZeilen.classList.toggle("offen");
      pf.classList.toggle("auf", auf);
    } },
      el("span", { class: "todogruppe" }, "Erledigt"),
      el("span", { class: "todozahl" }, anzahl + " Aufgaben"),
      pf));
    box.appendChild(fertigZeilen);
  }
  return box;
};

  return el("div", {}, termineBlock(), null);
};

const gesperrtDurch = (eintrag, stand) => {
  /* Eine Aufgabe kann an einer anderen hängen: erst buchen, dann melden. */
  const vor = eintrag[5];
  return vor && !stand[vor] ? vor : null;
};

const naechsteAufgaben = () => {
  /* Nach Datum, innerhalb eines Tages in der Reihenfolge der To-do-Liste. */
  const stand = hole("haken:alle", {});
  const sortiert = TODO_ALLE.map((e, i) => [e, i])
    .sort((a, b) => (alsTage(a[0][1]) ?? 9e9) - (alsTage(b[0][1]) ?? 9e9) || a[1] - b[1])
    .map(([e]) => e);
  const offene = sortiert.filter(([was]) => !stand[was]);
  /* Was noch an einer anderen Aufgabe hängt, wartet – es steht nicht oben. */
  return { stand, offene, machbar: offene.filter((e) => !gesperrtDurch(e, stand)) };
};

const termineKarte = (kopfNeu) => {
  /* Die zwei nächsten offenen To-dos – aufklappbar, Quelle ist die To-do-Liste. */
  const karteEl = el("div", { class: "terminkarte" });
  let offen = null;

  const zeichne = () => {
    karteEl.innerHTML = "";
    const { stand, machbar } = naechsteAufgaben();
    if (kopfNeu) kopfNeu(false);

    machbar.slice(0, 2).forEach((eintrag, i) => {
      const [was, datum, , , punkte] = eintrag;
      const detail = punkte || [];
      const dringend = (alsTage(datum) ?? 9e9) <= 3;

      const zeile = el("div", { class: "terminzeile" + (i ? " mitlinie" : "") });
      zeile.appendChild(el("button", {
        class: "terminknopf",
        onclick: () => { offen = offen === was ? null : was; zeichne(); },
      },
        el("span", { class: "terminwas" },
          was + (detail.length && offen !== was ? " …" : "")),
        el("span", { class: "terminwann" + (dringend ? " bald" : "") },
          wannText(datum))));

      /* Was an dieser Aufgabe hängt, steht klein darunter – dann ist die
         Reihenfolge sichtbar, ohne dass die Karte voll wird. */
      const danach = TODO_ALLE.filter((e) => e[5] === was && !stand[e[0]]);
      if (danach.length) {
        zeile.appendChild(el("div", { class: "danachzeile" }, "danach",
          danach.map((e) => el("span", { class: "danachpunkt" }, e[0]))));
      }

      if (offen === was) {
        const block = el("div", { class: "terminaufgaben" });
        detail.forEach((p) => block.appendChild(
          el("div", { class: "terminhinweis", html: p })));
        block.appendChild(el("button", {
          class: "haken",
          onclick: () => {
            stand[was] = true; merke("haken:alle", stand); offen = null; zeichnen();
          },
        },
          el("span", { class: "box" }),
          el("span", { class: "termintext" }, "Erledigt")));
        zeile.appendChild(block);
      }
      karteEl.appendChild(zeile);
    });
  };

  zeichne();

  return karteEl;
};

const termineBlock = () => {
  const behaelter = el("div", { class: "abstandoben" });
  const kopf = el("div", { class: "gruppenzeile" });
  const inhalt = termineKarte((alle) => {
    kopf.innerHTML = "";
    kopf.appendChild(el("span", { class: "gruppentitel klein3" }, "Als Nächstes"));
  });
  /* Drei Wege in die Listen – mit Zähler, damit man sieht, wo etwas offen ist. */
  const offeneTodos = (() => {
    const stand = hole("haken:alle", {});
    return TODO_ALLE.filter(([was]) => !stand[was]).length;
  })();
  const packStand = (() => {
    let ab = 0, alle = 0;
    PACKLISTE.forEach(([t, p]) => {
      const s = hole("haken:pack:" + t, {});
      p.forEach((x) => { alle++; if (s[x]) ab++; });
    });
    return ab + " von " + alle;
  })();
  const wochenStand = (() => {
    const s = hole("haken:woche", {});
    return WOCHE.filter((x) => s[x]).length + " von " + WOCHE.length;

  /* Alles im Blick: drei Kacheln nebeneinander, direkt auf dem Sand. */
  const kachel = (ikon, titel, zahl, bereich) =>

  behaelter.appendChild(el("div", { class: "gruppentitel klein3" }, "Alles im Blick"));

    kachel("check", "To-dos", offeneTodos + " offen", "todos"),
    kachel("book", "Checklisten", "6 Listen", "checklisten"),
    kachel("rucksack", "Packen", packStand, "packen"),
    wochenende() ? kachel("star", "Wochenende", wochenStand, "woche") : null));

  behaelter.appendChild(kopf);
  const eineKarte = el("div", { class: "karte startkarte" });
  eineKarte.appendChild(inhalt);
  behaelter.appendChild(eineKarte);
  return behaelter;
};

const vorbereitungFertigOben = () => {
  const stand = hole("haken:alle", {});
  return TODO_ALLE.every(([was]) => stand[was]);
};

const seiteHeute = () => {
  /* Ein Sprung von aussen kann den Bereich vorgeben: gehe("heute", "packen"). */
  let offeneListe = null;
  if (typeof param === "string") {
    const [ber, ...rest] = param.split("|");
    if (["todos", "checklisten", "packen"].includes(ber)) bereichHeute = ber;
    if (rest.length) offeneListe = rest.join("|");
  }
  const wrap = el("div");

  /* Jede Gruppe kommt in eine eigene weisse Fläche – wie in den Themen. */
  const gruppe = (titel, listen) => {
    const marke = el("div", { class: "gruppentitel abstandoben klein3" }, titel);
    marke.id = "gr-" + titel.toLowerCase().replace(/[^a-zäöü]+/g, "");
    wrap.appendChild(marke);
    const band = el("div", { class: "blockband" });
    listen.forEach((l) => band.appendChild(l));
    wrap.appendChild(band);
  };

  /* Was zu tun ist – getrennt von dem, was mitkommt.
     Der Vorbereitungsteil steht oben und fällt nach dem Abflug weg. */
  /* Ist die Vorbereitung erledigt, rutscht sie ans Ende – weg ist sie nie. */
  const erledigt = (schluessel, punkte) => {
    const stand = hole("haken:" + schluessel, {});
    const alle = punkte.concat(hole("eigene:" + schluessel, []));
    return alle.every((p) => stand[p]);
  };
  const vorbereitungFertig = erledigt("abflug", VOR_ABFLUG);

  /* Es wird immer nur ein Bereich gezeigt – gewählt über die Kacheln oben. */
  if (bereichHeute === "todos" && !vorbereitungFertigOben()) {
    wrap.appendChild(todoTabelle());
  }

  if (bereichHeute === "checklisten") {
    /* Was sie ständig braucht, steht oben; was einmal gilt, darunter.
       Bis zum Abflug ist der Abflugtag die Ausnahme und kommt zuoberst. */
    const immer = () => [
      faltHakenliste("Angekommen", ANKUNFT, "ankunft", true),
      faltHakenliste("Tagsüber weg", TOUR, "tour", true),
      faltHakenliste("Weiterreise", ORTSWECHSEL, "ortswechsel", true),
      faltHakenliste("Jede Woche", WOCHE, "woche", true, WOCHE_WICHTIG),
    ];
    if (new Date() < new Date(ABFLUG)) {
      gruppe("Jetzt", [faltHakenliste("Vor dem Abflugtag", VOR_ABFLUG, "abflug")]);
      gruppe("Immer wieder", immer());
      gruppe("Am Schluss", [faltHakenliste("Rückkehr", RUECKKEHR, "rueckkehr")]);
    } else {
      gruppe("Immer wieder", immer());
      gruppe("Einmal", [
        faltHakenliste("Vor dem Abflugtag", VOR_ABFLUG, "abflug"),
        faltHakenliste("Rückkehr", RUECKKEHR, "rueckkehr"),
      ]);
    }
  }

  if (bereichHeute === "packen") {
    const ORDNUNG = [
      ["Reiserucksack – Flug", PACK_RUCKSACK, "pack:rucksack"],
      ["Handgepäck – Flug", PACK_HAND, "pack:hand"],
      ["Bodybag am Körper", PACK_BODY, "pack:body"],
      ["Im Bus", PACK_INLAND, "pack:inland"],
      ["Tagesrucksack unterwegs", TAGESRUCKSACK, "tour:rucksack"],
    ];
    const ausruestung = PACKLISTE.map(([t, p]) => [t, p, "pack:" + t]);
    /* Kam man über einen Sprung auf eine bestimmte Liste, steht nur sie da –
       sonst sucht man sie zwischen allen anderen. */
    const nurEine = zurueckZu
      ? ORDNUNG.concat(ausruestung).find(([, , k]) => k === offeneListe) : null;

    if (nurEine) {
      gruppe("Packordnung", [
        faltHakenliste(nurEine[0], nurEine[1], nurEine[2], true, 0, true),
      ]);
    } else {
      gruppe("Packordnung", ORDNUNG.map(([t, p, k]) =>
        faltHakenliste(t, p, k, true, 0, offeneListe === k)));
      gruppe("Ausrüstung", ausruestung.map(([t, p, k]) =>
        faltHakenliste(t, p, k, false, 0, offeneListe === k)));
    }
  }


  if (false) {
    gruppe("Erledigt vor der Reise", [
      faltHakenliste("Am Abflugtag", VOR_ABFLUG, "abflug"),
    ]);
  }

  return wrap;
};

        : "Noch " + tage + " Tage";

      /* Welche Phase gilt jetzt? */
      const phase = tage < 0 ? "nach" : tage === 0 ? "tag" : tage === 1 ? "vortag" : "vor";
      const dran = S.jetzt.filter(([wann, ab]) =>
        wann === phase && (wann !== "vor" || tage <= (ab || 99))).slice(0, 4);

      if (tage <= 7) {

const seiteRoute = () => {
  const wrap = el("div");
  const inhalt = el("div");
  let tab = (param && param.tab) || "etappen";
  let station = (param && param.station) || null;
  offeneStation = station;
  let land = (param && param.land) || "guatemala";

  const farbe = { guatemala: "gt", costarica: "cr", schweiz: "ch" };

  /* Flaggen als Vektorgrafik – auf jedem Gerät gleich. */
  const flagge = (schluessel) => {
    const rahmen = (inneres) => {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 21 14");
      s.setAttribute("width", "22");
      s.setAttribute("height", "15");
      s.setAttribute("class", "flagge");
      s.innerHTML = inneres
        + '<rect x=".25" y=".25" width="20.5" height="13.5" fill="none"'
        + ' stroke="rgba(0,0,0,.18)" stroke-width=".5"/>';
      return s;
    };
    if (schluessel === "guatemala") {
      return rahmen('<rect width="7" height="14" fill="#4997D0"/>'
        + '<rect x="7" width="7" height="14" fill="#fff"/>'
        + '<rect x="14" width="7" height="14" fill="#4997D0"/>'
        + '<circle cx="10.5" cy="7" r="2.1" fill="none" stroke="#4E6B52" stroke-width=".7"/>');
    }
    if (schluessel === "schweiz") {
      return rahmen('<rect width="21" height="14" fill="#D52B1E"/>'
        + '<rect x="8.6" y="3" width="3.8" height="8" fill="#fff"/>'
        + '<rect x="6.5" y="5.1" width="8" height="3.8" fill="#fff"/>');
    }
    if (schluessel === "costarica") {
      return rahmen('<rect width="21" height="14" fill="#002B7F"/>'
        + '<rect y="2.8" width="21" height="8.4" fill="#fff"/>'
        + '<rect y="4.9" width="21" height="4.2" fill="#CE1126"/>');
    }
    return rahmen('<rect width="7" height="14" fill="#D91023"/>'
      + '<rect x="7" width="7" height="14" fill="#fff"/>'
      + '<rect x="14" width="7" height="14" fill="#D91023"/>');
  };

  /* Holt einen Block dort, wo er einmal steht – nichts wird kopiert. */
  const holeBlock = (v) => {
    if (v[0] === "land") {
      const L = LAENDER[v[1]];
      const b = L.bloecke.find(([t]) => ohneMarker(t) === v[2]);
      return b ? [[b[0], b[1]]] : [];
    }
    const D = DOKUMENTE.find((x) => x.id === v[1]);
    if (!D) return [];
    if (v.length === 2) return D.bloecke;
    const b = D.bloecke.find(([t]) => ohneMarker(t) === v[2]);
    return b ? [[b[0], b[1]]] : [];
  };

  /* Die Abschnitte einer Station – erscheinen direkt unter ihrer Zeile. */
  const stationsinhalt = (S) => {
    const box = el("div", { class: "stationsinhalt" });
    const LISTEN = {
      "abflug": ["Vor dem Abflugtag", VOR_ABFLUG],
      "vorreise": ["Wochen vorher", VOR_REISE],
      "ankunft": ["Angekommen", ANKUNFT],
      "ortswechsel": ["Weiterreise", ORTSWECHSEL],
      "pack:inland": ["Packordnung Inland", PACK_INLAND],
      "pack:rucksack": ["Reiserucksack", PACK_RUCKSACK],
      "pack:hand": ["Handgepäck", PACK_HAND],
      "pack:body": ["Bodybag", PACK_BODY],
      "woche": ["Jede Woche", WOCHE],
      "tour:rucksack": ["Tagesrucksack", TAGESRUCKSACK],
      "tour": ["Tagsüber weg", TOUR],
      "rueckkehr": ["Rückkehr", RUECKKEHR],
    };

    /* Zeitstatus und die Aufgaben, die jetzt anstehen. */
    if (S.datum && S.jetzt) {
      const heute = new Date(); heute.setHours(0, 0, 0, 0);
      const ziel = new Date(S.datum + "T00:00:00");
      const tage = Math.round((ziel - heute) / 86400000);

      const status = tage < 0 ? "Erledigt"
        : tage === 0 ? "Heute"
        : tage === 1 ? "Morgen"
        : tage === 2 ? "Übermorgen"
        : "Noch " + tage + " Tage";

      /* Welche Phase gilt jetzt? */
      const phase = tage < 0 ? "nach" : tage === 0 ? "tag" : tage === 1 ? "vortag" : "vor";
      const dran = S.jetzt.filter(([wann, ab]) =>
        wann === phase && (wann !== "vor" || tage <= (ab || 99))).slice(0, 4);

      if (tage <= 7) {
        box.appendChild(el("div", { class: "stopstatus" + (tage <= 1 ? " nah" : "") }, status));
      }

      if (dran.length) {
        box.appendChild(el("div", { class: "gruppentitel klein3 jetzttitel" }, "Jetzt erledigen"));
        const kasten = el("div", { class: "jetztliste" });
        dran.forEach(([, , was, links]) => {
          kasten.appendChild(el("div", { class: "jetztzeile" },
            el("span", { class: "jetztpunkt" }),
            el("span", { class: "min0" },
              el("span", { class: "jetzttext" }, was),
              (links || []).length
                ? el("span", { class: "jetztlinks" },
                    links.map(([name, url], i) =>
                      el("a", { href: url, target: "_blank", rel: "noopener",
                                class: "aktionslink" },
                        name, svg("link", 12, "#B65A3C", 2))))
                : null)));
        });
        box.appendChild(kasten);
      }
    }

    S.abschnitte.forEach(([titel, eintraege]) => {
      /* Ein Titel mit ">> " ist ein Ablaufschritt: offen, ohne Aufklappen. */
      const ablauf = String(titel).startsWith(">> ");
      const reinT = ablauf ? titel.slice(3) : titel;

      if (ablauf) {
        /* Der Abschnitt, der jetzt gilt, wird ganz leicht hervorgehoben. */
        const phasenwort = { vor: "2 Tage", vortag: "1 Tag",
                             tag: "Am Flugtag", nach: "Nach der Landung" };
        const jetztPhase = S.datum ? (() => {
          const h = new Date(); h.setHours(0, 0, 0, 0);
          const t = Math.round((new Date(S.datum + "T00:00:00") - h) / 86400000);
          /* Erst ab zwei Tagen vorher gilt ein Abschnitt als aktuell. */
          if (t < 0) return "nach";
          if (t === 0) return "tag";
          if (t === 1) return "vortag";
          if (t === 2) return "vor";
          return null;
        })() : null;
        const istJetzt = jetztPhase && reinT.startsWith(phasenwort[jetztPhase]);

        box.appendChild(el("div", { class: "schrittblock" + (istJetzt ? " jetzt" : "") },
          el("div", { class: "schrittzeit" }, reinT),
          ...eintraege.map((e) => {
            const roh = e[2] || [];
            const punkte = roh.filter((x) => !(zerlege(x) || {}).url);
            const links = roh.filter((x) => (zerlege(x) || {}).url);
            return el("div", {},
              el("ul", { class: "punkte offenblock" },
                punkte.map((r) => {
                  /* Ein Punkt mit Sprung ist selbst antippbar – kein zweiter Rahmen. */
                  if (r && r.punkt && r.sprung) {
                    const teil = zerlege(r.punkt);
                    const inhalt = typeof teil === "string"
                      ? el("span", { html: teil })
                      : el("span", {},
                          el("b", { class: "begriff" }, teil.begriff),
                          el("span", { class: "unterzeile", html: teil.text }));
                    return el("li", { class: "punktsprung" },
                      el("button", { class: "punktknopf",
                        onclick: () => gehe(r.sprung, r.param, true) },
                        el("span", { class: "min0" }, inhalt),
                        el("span", { class: "faltpfeil pfeilrechts" },
                          svg("chevron", 15, "#B65A3C", 2.2))));
                  }
                  const p = zerlege(r);
                  if (typeof p === "string") return el("li", { html: p });
                  if (p.begriff) return begriffZeile(p);
                  if (p.sprung) return el("li", { class: "ohnepunkt" }, sprungZeile(p));
                  return el("li", { class: "ohnepunkt" }, anrufZeile(p));
                })),
              links.length
                ? el("div", { class: "linkblock" }, links.map((r) => linkZeile(zerlege(r))))
                : null);
          })));
        return;
      }

      box.appendChild(el("div", { class: "gruppentitel abstandoben klein3 stopptitel" }, titel));
      const band = el("div", { class: "blockband flach" });
      eintraege.forEach((e) => {
        if (e[0] === "eigen") { band.appendChild(faltblock(e[1], e[2], false)); return; }
        if (e[0] === "liste") {
          const [name, punkte] = LISTEN[e[1]];
          band.appendChild(faltHakenliste(name, punkte, e[1], true));
          return;
        }
        if (e[0] === "hostels") {
          /* In der Station nur die ersten zwei – der Rest hinter einer Zeile. */
          const alle = LAENDER[e[1]].hostels || [];
          alle.slice(0, 2).forEach((h) => band.appendChild(hostelKarte(h)));
          if (alle.length > 2) {
            const rest = el("div", { class: "faltinhalt" });
            alle.slice(2).forEach((h) => rest.appendChild(hostelKarte(h)));
            const pf = el("span", { class: "faltpfeil" }, svg("chevron", 18, "#B65A3C", 2.2));
            band.appendChild(el("div", { class: "karte faltkarte" },
              el("button", { class: "faltkopf", onclick: () => {
                const auf = rest.classList.toggle("offen");
                pf.classList.toggle("auf", auf);
              } },
                el("span", { class: "blocktitel ohneabstand" },
                  (alle.length - 2) + " weitere Häuser"),
                pf),
              rest));
          }
          return;
        }
        holeBlock(e).forEach((b) => {
          if (String(b[0]).startsWith("## ")) return;
          band.appendChild(faltblock(ohneMarker(b[0]), b[1], false));
        });
      });
      box.appendChild(band);
    });
    return box;
  };

  const zeichne = () => {
    inhalt.innerHTML = "";

    if (tab === "land") {
      const L = LAENDER[land];
      inhalt.appendChild(el("button", { class: "zurueckzeile",
        onclick: () => { tab = "etappen"; zeichne(); } },
        el("span", { class: "zurueckpfeil" }, svg("chevron", 16, "#B65A3C", 2)),
        el("span", {}, "Route")));
      inhalt.appendChild(el("div", { class: "landtitel" }, L.name));
      if (land === "guatemala" && typeof KARTE_GT !== "undefined") {
        inhalt.appendChild(el("div", { class: "karte bild" },
          el("img", { src: KARTE_GT, alt: "Karte Guatemala" })));
      }
      if (land === "costarica" && typeof KARTE_CR !== "undefined") {
        inhalt.appendChild(el("div", { class: "karte bild" },
          el("img", { src: KARTE_CR, alt: "Karte Costa Rica" })));
        inhalt.appendChild(linkZeile({
          label: "Visit Costa Rica – offizielles Tourismusportal",
          url: "https://de.visitcostarica.com/",
          hinweis: "Auf Deutsch, vom Tourismusinstitut ICT",
        }));
      }
      const zielBlock = param && param.block;
      bloeckeMit(L.bloecke).forEach((x) => inhalt.appendChild(x));
      if (zielBlock) {
        setTimeout(() => {
          const kopf = Array.from(document.querySelectorAll(".faltkopf"))
            .find((e) => e.textContent.trim().startsWith(zielBlock));
          if (kopf) { kopf.click(); kopf.scrollIntoView({ block: "start" }); }
        }, 30);
      }
      if (L.hostels && L.hostels.length) {
        inhalt.appendChild(el("div", { class: "gruppentitel abstandoben klein3" }, "Hostels"));
        const band = el("div", { class: "blockband" });
        L.hostels.forEach((h) => band.appendChild(hostelKarte(h)));
        inhalt.appendChild(band);
      }
      /* Zweiter Ort mit eigener Liste, etwa Panajachel am Atitlán. */
      if (L.hostels2 && L.hostels2.liste && L.hostels2.liste.length) {
        inhalt.appendChild(el("div", { class: "gruppentitel abstandoben klein3" },
          L.hostels2.ort));
        const band2 = el("div", { class: "blockband" });
        L.hostels2.liste.forEach((h) => band2.appendChild(hostelKarte(h)));
        inhalt.appendChild(band2);
        if (L.hostels2.hostelworld) {
          inhalt.appendChild(linkZeile(L.hostels2.hostelworld));
        }
      }
      return;
    }

    /* Die Route als Zeitachse */
    let letztes = null;
    let strang = null;
    STATIONEN.forEach((S) => {
      const k = S.land || "peru";
      if (k !== letztes) {
        /* Drei Zeilen wie bei den Stationen: Name, Zeitraum, Kurzbeschrieb. */
        const L = S.land ? LAENDER[S.land] : null;
        const name = L ? L.name : "Peru";
        const klasse = S.land ? farbe[S.land] : "pe";
        const dreizeiler = () => el("div", { class: "landtext" },
          el("div", { class: "landzeile" },
            el("span", { class: "landname " + klasse }, name),
            flagge(S.land || "peru")),
          el("div", { class: "landzeit" }, L ? L.zeit : "Ende Dezember, offen"),
          el("div", { class: "hinweis" },
            L ? L.kurz : "Mit einer Freundin, noch nichts gebucht"));

        if (S.land) {
          inhalt.appendChild(el("button", { class: "landmarke landknopf",
            onclick: () => { tab = "land"; land = S.land; zeichne(); } },
            dreizeiler(),
            el("span", { class: "landpfeil" }, svg("chevron", 15, "#B65A3C", 2))));
        } else {
          inhalt.appendChild(el("div", { class: "landmarke" }, dreizeiler()));
        }

        /* Tourismusportal des Landes – schmale Zeile unter der Ländermarke. */
        if (S.land === "costarica") {
          inhalt.appendChild(el("a", {
            href: "https://de.visitcostarica.com/", target: "_blank", class: "portalzeile" },
            el("span", { class: "portaltext" },
              "Visit Costa Rica · offizielles Tourismusportal"),
            svg("link", 14, "#B65A3C", 1.8)));
        }
        strang = el("div", { class: "strang" });
        inhalt.appendChild(strang);
        letztes = k;
      }
      const unbestimmt = /offen|noch nicht/i.test(S.zeit + S.kurz);
      const auf = station === S.id;
      strang.appendChild(el("button", { class: "etappe etappeknopf" + (auf ? " auf" : ""),
        onclick: () => { station = auf ? null : S.id; offeneStation = station; zeichne(); } },
        el("span", { class: "punkt" + (unbestimmt ? " offen" : "") }, S.nummer),
        el("div", { class: "etappenort" }, S.titel),
        el("div", { class: "etappenzeit" }, S.zeit),
        el("div", { class: "hinweis" }, S.kurz),
        el("span", { class: "etappepfeil" + (auf ? " auf" : "") },
          svg("chevron", 16, "#B65A3C", 2))));
      if (auf) strang.appendChild(stationsinhalt(S));
    });
  };

  wrap.appendChild(inhalt);
  zeichne();
  return wrap;
};


/* ── Navigation ────────────────────────────────────────────────── */

const BEREICHE = [
  ["start", "Home", "home"],
  ["heute", "To-dos", "check"],
  ["route", "Route", "map", true],     // Mitte: der Hauptweg
  ["geld", "Geld", "wallet"],
  ["wissen", "Wissen", "book"],
];

function gehe(ziel, p = null, merken = false) {
  if (merken) {
    /* Die offene Station und die Scrollhöhe mitnehmen, sonst landet man oben. */
    const zurueckParam = (seite === "route" && offeneStation)
      ? { station: offeneStation } : param;
    zurueckZu = { seite, param: zurueckParam, hoehe: window.scrollY || 0 };
  }
  else if (ziel !== "zurueck") zurueckZu = null;
  if (ziel === "zurueck" && zurueckZu) {
    const z = zurueckZu; zurueckZu = null;
    seite = z.seite; param = z.param; zeichnen();
    window.scrollTo(0, z.hoehe || 0);
    setTimeout(() => window.scrollTo(0, z.hoehe || 0), 40);
    return;
  }
  if (seite !== "suche") vorSuche = seite;
  seite = ziel;
  param = p;
  /* "packen|pack:flug" wählt Bereich und Liste – vor dem Zeichnen setzen. */
  if (ziel === "heute" && typeof p === "string") {
    const ber = p.split("|")[0];
    if (["todos", "checklisten", "packen"].includes(ber)) bereichHeute = ber;
  }
  zeichnen();
  window.scrollTo(0, 0);
}

function leiste() {
  return el("nav", { class: "tableiste" },
    BEREICHE.map(([k, l, ikon, wichtig]) => {
      const aktiv = seite === k || (seite === "suche" && vorSuche === k);
      /* Aktiv: Anthrazit und halbfett. Terracotta bleibt der Route vorbehalten. */
      const farbe = wichtig ? "#B65A3C" : (aktiv ? "#211C18" : "#8B8175");
      return el("button", {
        class: "tab" + (aktiv ? " an" : "") + (wichtig ? " wichtig" : ""),
        onclick: () => gehe(k),
      },
        wichtig
          ? el("span", { class: "tabkreis" + (aktiv ? " an" : "") },
              svg(ikon, 19, aktiv ? "#fff" : "#B65A3C", 1.9))
          : svg(ikon, 21, farbe, aktiv ? 2 : 1.8),
        el("span", { style: "color:" + farbe }, l));
    }));
}

function zeichnen() {
  app.innerHTML = "";

  /* Kam man über einen Sprung hierher, führt eine Zeile zurück. */
  if (zurueckZu) {
    const HER = { route: "zur Route", heute: "zu den To-dos", geld: "zu Geld",
                  wissen: "zu Wissen", buchen: "zu Buchen", start: "zum Start" };
    app.appendChild(el("button", { class: "zurueckpfad",
      onclick: () => gehe("zurueck") },
      svg("back", 15, "#B65A3C", 2.2),
      el("span", {}, "Zurück " + (HER[zurueckZu.seite] || "zurück"))));
  }
  ["topbar", "startkopf"].forEach((id) => {
    const alt = document.getElementById(id);
    if (alt) alt.remove();
  });
  const seiten = {
    start: seiteStart, heute: seiteHeute, suche: seiteSuche, notfall: seiteNotfall,
    buchen: seiteBuchen, route: seiteRoute, geld: seiteGeld, wissen: seiteWissen,
  };
  if (seite !== "start" && seite !== "suche") {
    /* Dasselbe Zeichen wie unten in der Leiste – oben nur kleiner. */
    const SEITENNAME = {
      heute: ["To-dos", "check"], route: ["Route", "map"], geld: ["Geld", "wallet"],
      wissen: ["Wissen", "book"], notfall: ["Notfall", "shield"],
      buchen: ["Buchen", "map"],
    };
    const [name, ikon] = SEITENNAME[seite] || ["", null];
    /* Auf der Route hängen drei Wege direkt unter der Kopfzeile – beides klebt. */
    const schnellkachel = (ikon, titel, wohin, param2) =>
      el("button", { class: "routenkachel", onclick: () => gehe(wohin, param2) },
        svg(ikon, 14, "#A08C7D", 1.8), el("span", {}, titel));

    /* Umschalten: es wird immer nur ein Bereich gezeigt. */
    const bereichkachel = (ikon, titel, schluessel) => {
      const an = bereichHeute === schluessel;
      return el("button", { class: "routenkachel" + (an ? " an" : ""), onclick: () => {
        bereichHeute = schluessel; zeichnen(); window.scrollTo(0, 0);
      } }, svg(ikon, 14, an ? "#B65A3C" : "#A08C7D", 1.8), el("span", {}, titel));
    };

    const kacheln = seite === "route"
      ? el("div", { class: "routenkacheln" },
          schnellkachel("shield", "EDA", "wissen", "eda"),
          schnellkachel("check", "Sicherheit", "wissen", "sicherheit"),
          schnellkachel("bed", "Buchen", "buchen"))
      : seite === "heute"
      ? el("div", { class: "routenkacheln" },
          bereichkachel("check", "To-dos", "todos"),
          bereichkachel("book", "Checklisten", "checklisten"),
          bereichkachel("rucksack", "Packen", "packen"))
      : null;

    document.body.insertBefore(el("div", { class: "kopfzeile" + (kacheln ? " mitkacheln" : ""),
      id: "topbar" },
      el("div", { class: "kopfreihe" },
      el("span", { class: "seitenname" },
        ikon ? svg(ikon, 16, "#B65A3C", 2) : null,
        el("span", {}, name)),
      seite === "notfall" ? el("span") : el("button", {
        class: "notknopf", onclick: () => gehe("notfall"),
      }, svg("shield", 17, "#A8322A", 2), el("span", {}, "Notfall")),
      el("button", {
        class: "lupe", "aria-label": "Suchen",
        onclick: () => { vorSuche = seite; seite = "suche"; zeichnen(); window.scrollTo(0, 0); },
      }, svg("search", 16, "#B65A3C", 1.9))),
      kacheln), app);
  }
  app.appendChild((seiten[seite] || seiteStart)());
  app.appendChild(leiste());
}

zeichnen();

</script>
